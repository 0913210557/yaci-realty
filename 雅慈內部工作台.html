        <button class="btn btn-ghost btn-sm" type="button" id="editCancelViewingItemBtn-${logId}">取消</button>
      </div>
    `;
    drawEditViewingItemsList(logId);
    document.getElementById(`editShowViewingItemFormBtn-${logId}`).onclick = ()=>{
      editingCtx.editLogViewingItemEditIndex = -1;
      config.fields.forEach(f=>{ const el = document.getElementById(`editViewItem-${logId}-${f.key}`); if(el) el.value=''; });
      const btn = document.getElementById(`editConfirmViewingItemBtn-${logId}`);
      if(btn) btn.textContent = '確認加入';
      document.getElementById(`editShowViewingItemFormBtn-${logId}`).style.display = 'none';
      document.getElementById(`editViewingItemFormFields-${logId}`).style.display = 'block';
    };
    document.getElementById(`editCancelViewingItemBtn-${logId}`).onclick = ()=>{
      editingCtx.editLogViewingItemEditIndex = -1;
      config.fields.forEach(f=>{ const el = document.getElementById(`editViewItem-${logId}-${f.key}`); if(el) el.value=''; });
      const btn = document.getElementById(`editConfirmViewingItemBtn-${logId}`);
      if(btn) btn.textContent = '確認加入';
      document.getElementById(`editViewingItemFormFields-${logId}`).style.display = 'none';
      document.getElementById(`editShowViewingItemFormBtn-${logId}`).style.display = 'inline-block';
    };
    return;

  const extra = (l && l.extra) || {};

  if(config.special === 'meeting'){

async function saveClient(){
  await flushPendingClientInputs();
  const typesChecked = Array.from(document.querySelectorAll('.f_type_cb:checked')).map(cb=>cb.value);
  const statusesChecked = Array.from(document.querySelectorAll('.f_status_cb:checked')).map(cb=>cb.value);
  const vals = {
    name: document.getElementById('f_name').value.trim(),
    phones: editingCtx.tempPhones || [],
    types: typesChecked,
    statuses: statusesChecked,
    birthday: document.getElementById('f_birthday').value,
    fileDate: document.getElementById('f_fileDate').value,
    source: document.getElementById('f_source').value.trim(),
    propertyAddress: document.getElementById('f_propertyAddress').value.trim(),
    lineNames: (editingCtx.tempLineNames || []).map(n=>n.value),
    lineId: document.getElementById('f_lineId').value.trim(),
    fb: document.getElementById('f_fb').value.trim(),
    company: document.getElementById('f_company').value.trim(),
    idNumber: document.getElementById('f_idNumber').value.trim(),
    homeAddress: document.getElementById('f_homeAddress').value.trim(),
    needsProfiles: editingCtx.tempNeedsProfiles || [],
    propertyRecords: editingCtx.tempPropertyRecords || [],
    notes: document.getElementById('f_notes').value.trim(),
    serviceLogs: editingCtx.tempLogs || [],
  };
  if(!vals.name){ showToast('請輸入姓名'); return false; }

  const otherClients = DATA.clients.filter(c=>!c.isDutyRosterClient && c.id !== editingCtx.id);
  const nameMatches = otherClients.filter(c=>c.name && c.name.trim() === vals.name);
  const newPhoneNumbers = (vals.phones||[]).map(p=>(p.number||'').trim()).filter(Boolean);
  const phoneMatches = [];
  otherClients.forEach(c=>{
    const existingNumbers = getClientPhones(c).map(p=>(p.number||'').trim()).filter(Boolean);
    const overlap = existingNumbers.filter(n=>newPhoneNumbers.includes(n));
    if(overlap.length) phoneMatches.push({client:c, numbers:overlap});
  });
  if(nameMatches.length || phoneMatches.length){
    const lines = [];
    if(nameMatches.length) lines.push(`姓名重複：${nameMatches.map(c=>c.name).join('、')}`);
    if(phoneMatches.length) lines.push(`電話重複：${phoneMatches.map(m=>`${m.client.name}(${m.numbers.join('、')})`).join('、')}`);
    const proceed = confirm(`發現可能重複的客戶資料：\n${lines.join('\n')}\n\n要繼續儲存嗎？`);
    if(!proceed) return false;
  }

  for(const k of editingCtx.removedCardPhotoKeys) await deleteStoredFile(k);
  for(const p of editingCtx.cardPhotos){
    if(!p.key){
      const newKey = 'photo:client:' + uid();
      if(!await saveStoredFile(newKey, p.dataUrl, '客戶名片照片')) return false;
      p.key = newKey;
    }
  }
  vals.cardPhotoKeys = editingCtx.cardPhotos.map(p=>p.key);

  for(const k of editingCtx.removedAttachmentKeys) await deleteStoredFile(k);
  for(const p of editingCtx.attachments){
    if(!p.key){
      const newKey = 'photo:client-doc:' + uid();
      if(!await saveStoredFile(newKey, p.dataUrl, p.fileName||'附件')) return false;
      p.key = newKey;
    }
  }
  vals.attachmentKeys = editingCtx.attachments.map(p=>p.key);

  for(const k of editingCtx.removedRecordPhotoKeys) await deleteStoredFile(k);
  for(const record of vals.propertyRecords){
    const cache = editingCtx.recordPhotosCache[record.id];
    if(!cache) continue;
    for(const k of cache.removedKeys) await deleteStoredFile(k);
    for(const p of cache.photos){
      if(!p.key){
        const newKey = 'photo:property-record:' + uid();
        if(!await saveStoredFile(newKey, p.dataUrl, p.fileName||'物件照片')) return false;
        p.key = newKey;
      }
    }
    record.photoKeys = cache.photos.map(p=>p.key);
  }

  if(editingCtx.id){
    const idx = DATA.clients.findIndex(c=>c.id===editingCtx.id);
    DATA.clients[idx] = {...DATA.clients[idx], ...vals};
  }else{
    DATA.clients.push({id: uid(), ...vals});
  }
  await saveType('clients');
  return true;
}

function pushLightboxPhoto(src, filename){
  __lightboxPhotos.push({src, filename});
  return __lightboxPhotos.length - 1;
}
function openLightboxByIndex(i){

function openOrDownloadFile(i){
  const p = __lightboxPhotos[i];
  if(!p || !p.src) return;
  if(isImageDataUrl(p.src)){
    openLightbox(p.src, p.filename);
  }else if(/^data:application\/pdf/.test(p.src)){
    window.open(p.src, '_blank');
  }else{
    const a = document.createElement('a');
    a.href = p.src;
    a.download = p.filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
}
async function downloadAllPhotos(indices){
  if(typeof JSZip === 'undefined'){
    showToast('壓縮功能載入失敗,改成一張一張下載');
    indices.forEach((idx, i)=>{
      const p = __lightboxPhotos[idx];
      if(!p || !p.src) return;
      setTimeout(()=>{
        const a = document.createElement('a');
        a.href = p.src;
        a.download = p.filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }, i * 250);
    });
    return;
  }
  showToast('打包中…');
  const zip = new JSZip();
  const usedNames = new Set();
  indices.forEach(idx=>{
    const p = __lightboxPhotos[idx];
    if(!p || !p.src) return;
    const commaIdx = p.src.indexOf(',');
    const base64 = p.src.slice(commaIdx+1);
    let name = p.filename || 'file';
    let finalName = name;
    let n = 1;
    while(usedNames.has(finalName)){
      const dot = name.lastIndexOf('.');
      finalName = dot>0 ? `${name.slice(0,dot)}(${n})${name.slice(dot)}` : `${name}(${n})`;
      n++;
    }
    usedNames.add(finalName);
    zip.file(finalName, base64, {base64:true});
  });
  try{
    const blob = await zip.generateAsync({type:'blob'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `照片檔案_${new Date().toISOString().slice(0,10)}.zip`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
    showToast('已下載壓縮檔');
  }catch(e){
    showToast('打包失敗：' + (e && e.message ? e.message : '未知錯誤'));
  }
}

function drawListingTable(){
  const q = (document.getElementById('listingSearch').value||'').toLowerCase();
  const st = document.getElementById('listingStatusFilter').value;
  let list = DATA.listings.filter(l=>{
    const matchQ = !q || (l.name+l.address+(l.ownerName||'')).toLowerCase().includes(q);
    const matchSt = !st || l.status===st;
    return matchQ && matchSt;
  });
  const wrap = document.getElementById('listingTableWrap');
  if(list.length===0){ wrap.innerHTML = '<div class="empty-state">沒有符合的物件</div>'; return; }
  wrap.innerHTML = `<table><thead><tr>
    <th>物件</th><th>類型</th><th>地址</th><th>開價</th><th>狀態</th><th>照片</th><th>屋主</th><th></th>
  </tr></thead><tbody>
    ${list.map(l=>`<tr class="row-hover">
      <td>${esc(l.name)}</td>
      <td><span class="tag">${esc(l.type)}</span></td>
      <td>${esc(l.address||'—')}</td>
      <td>${l.price?Number(l.price).toLocaleString()+' 萬':'—'}</td>
      <td>${statusStamp(l.status)}</td>
      <td>${(l.photoKeys&&l.photoKeys.length) ? '<span class="tag-soft">📷 '+l.photoKeys.length+'</span>' : '—'}</td>

      <td><div class="row-actions">
        <button class="icon-btn" onclick="openListingModal('${l.id}')" title="編輯">✎</button>
        <button class="icon-btn" onclick="deleteItem('listings','${l.id}')" title="刪除">🗑</button>

    </tr>`).join('')}
  </tbody></table>`;
}

async function openListingModal(id){
  const item = id ? DATA.listings.find(l=>l.id===id) : {name:'',type:'中古屋',address:'',price:'',status:'在售',ownerName:'',ownerPhone:'',notes:'',photoKeys:[]};
  editingCtx = {
    type:'listings',
    id: id||null,
    photos: [],       // {key, dataUrl}
    removedKeys: []
  };
  document.getElementById('modalTitle').textContent = id ? '編輯物件' : '新增物件';
  document.getElementById('modalBody').innerHTML = `
    <div class="field"><label>物件名稱</label><input id="f_name" value="${esc(item.name)}"></div>
    <div class="field-row">
      <div class="field"><label>類型</label>
        <select id="f_type">${['中古屋','預售屋','店面','土地','套房出租'].map(t=>`<option ${item.type===t?'selected':''}>${t}</option>`).join('')}</select>
      </div>
      <div class="field"><label>開價(萬)</label><input type="number" id="f_price" value="${esc(item.price)}"></div>
    </div>
    <div class="field"><label>地址</label><input id="f_address" value="${esc(item.address)}"></div>
    <div class="field"><label>狀態</label>
      <select id="f_status">${['在售','已簽約','已成交','已下架'].map(t=>`<option ${item.status===t?'selected':''}>${t}</option>`).join('')}</select>
    </div>
    <div class="field-row">
      <div class="field"><label>屋主姓名</label><input id="f_ownerName" value="${esc(item.ownerName)}"></div>
      <div class="field"><label>屋主電話</label><input id="f_ownerPhone" value="${esc(item.ownerPhone)}"></div>
    </div>
    <div class="field"><label>備註</label><textarea id="f_notes">${esc(item.notes)}</textarea></div>

    <div class="field field-divider">
      <div class="field-sub-title">物件照片</div>
      <div class="photo-grid" id="photoGrid"><span class="tag-soft">載入中…</span></div>
      <input type="file" accept="image/*" multiple id="listingPhotoInput" style="display:none;">
    </div>
  `;
  openModal();

  editingCtx.photos = [];
  for(const k of (item.photoKeys||[])){
    const dataUrl = await loadStoredFile(k);
    if(dataUrl) editingCtx.photos.push({key:k, dataUrl});
  }
  renderPhotoGrid();

  document.getElementById('listingPhotoInput').onchange = async (e)=>{
    const files = Array.from(e.target.files||[]);
    for(const file of files){
      const dataUrl = await resizeImage(file, 1000, 0.72);
      editingCtx.photos.push({key:null, dataUrl});
    }
    e.target.value = '';
    renderPhotoGrid();
  };
}

function renderPhotoGrid(){
  const grid = document.getElementById('photoGrid');
  if(!grid) return;
  const addTile = `<div class="upload-btn" id="addPhotoTile">＋<br>新增照片</div>`;
  grid.innerHTML = editingCtx.photos.map((p,idx)=>`
    <div class="photo-chip">
      <img src="${p.dataUrl}">
      <button class="rm" onclick="removeListingPhoto(${idx})" title="移除">✕</button>
    </div>
  `).join('') + addTile;
  document.getElementById('addPhotoTile').onclick = ()=>document.getElementById('listingPhotoInput').click();
}
function removeListingPhoto(idx){
  const p = editingCtx.photos[idx];
  if(p.key) editingCtx.removedKeys.push(p.key);
  editingCtx.photos.splice(idx,1);
  renderPhotoGrid();
}

    address: document.getElementById('f_address').value.trim(),
    status: document.getElementById('f_status').value,
    ownerName: document.getElementById('f_ownerName').value.trim(),
    ownerPhone: document.getElementById('f_ownerPhone').value.trim(),
    notes: document.getElementById('f_notes').value.trim(),
  };
  if(!vals.name){ showToast('請輸入物件名稱'); return false; }

  for(const k of editingCtx.removedKeys) await deleteStoredFile(k);
  for(const p of editingCtx.photos){
    if(!p.key){
      const newKey = 'photo:listing:' + uid();
      if(!await saveStoredFile(newKey, p.dataUrl, '物件照片')) return false;
      p.key = newKey;
    }
  }
  vals.photoKeys = editingCtx.photos.map(p=>p.key);

  if(editingCtx.id){
    const idx = DATA.listings.findIndex(l=>l.id===editingCtx.id);
    DATA.listings[idx] = {...DATA.listings[idx], ...vals};
  }else{
    DATA.listings.push({id: uid(), ...vals});
  }
  await saveType('listings');
  return true;
}

function readFileAsDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function renderDealAttachmentGrid(){

      for(const k of item.attachmentKeys){
        const dataUrl = await loadDealFile(k);
        if(dataUrl) editingCtx.dealAttachments.push({key:k, dataUrl});
      }
    }

function removeDealAttachment(idx){

function updateDealExpectedDisplay(){
  const el = document.getElementById('dealActualPerformance');
  if(!el) return;
  const buyerFee = Number(document.getElementById('f_buyerFee').value || 0);
  const sellerFee = Number(document.getElementById('f_sellerFee').value || 0);
  const referralFee = Number(document.getElementById('f_referralFee').value || 0);
  el.textContent = '$' + (buyerFee + sellerFee - referralFee).toLocaleString();
}

const DEAL_MY_NAME = '張雅慈';
function dealDateAscComparator(a,b){
  const dc = (a.closedDate||'').localeCompare(b.closedDate||'');
  if(dc !== 0) return dc;
  return DATA.deals.indexOf(a) - DATA.deals.indexOf(b);
}
function dealDateDescComparator(a,b){
  const dc = (b.closedDate||'').localeCompare(a.closedDate||'');
  if(dc !== 0) return dc;
  return DATA.deals.indexOf(b) - DATA.deals.indexOf(a);
}

function dealExpectedCollection(actualPerformance, dealType){
  return Math.round(actualPerformance * 0.5 * 0.9);
}

function dealActualPerformance(d){
  if(d.actualPerformance !== undefined && d.actualPerformance !== '' && d.actualPerformance !== null){
    return Number(d.actualPerformance) || 0;
  }
  let amount = 0;
  if((d.devAgent||'').includes(DEAL_MY_NAME)) amount += Number(d.devAmount||0);
  if((d.saleAgent||'').includes(DEAL_MY_NAME)) amount += Number(d.saleAmount||0);
  return amount;
}
function getDealPersonalPerformanceTotal(){
  return Number((document.getElementById('f_actualPerformance')||{}).value || 0);
}
function detectDealPersonalPerformanceFromAllocation(){
  const devAgent = ((document.getElementById('f_devAgent')||{}).value || '').trim();
  const saleAgent = ((document.getElementById('f_saleAgent')||{}).value || '').trim();
  const devAmount = Number((document.getElementById('f_devAmount')||{}).value || 0);
  const saleAmount = Number((document.getElementById('f_saleAmount')||{}).value || 0);
  let amount = 0;
  if(devAgent.includes(DEAL_MY_NAME)) amount += devAmount;
  if(saleAgent.includes(DEAL_MY_NAME)) amount += saleAmount;
  return amount;
}
function redetectDealPersonalPerformance(){
  const el = document.getElementById('f_actualPerformance');
  if(!el) return;
  el.value = detectDealPersonalPerformanceFromAllocation();
  renderDealCollectionsList();
  showToast('已重新偵測,記得確認金額對不對');
}

function renderDealCollectionsList(){
  const wrap = document.getElementById('dealCollectionsList');
  if(!wrap) return;
  const list = editingCtx.tempCollections || [];
  const total = getDealPersonalPerformanceTotal();
  const currentDealType = (document.getElementById('f_dealType')||{}).value || '售';
  const expectedCollection = dealExpectedCollection(total, currentDealType);

  const formulaEl = document.getElementById('dealExpectedFormulaHint');
  if(formulaEl){
    const formulaText = '應領金額 = 實際業績 × 50%(公司抽成) × 90%(扣10%執行業務所得後)';
    formulaEl.innerHTML = `${formulaText} <b>$${expectedCollection.toLocaleString()}</b>`;
  }

  wrap.innerHTML = list.length ? list.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(c=>{
    const amt = Number(c.personalAmount||0);
    return `
    <div class="log-entry">
      <div class="log-entry-date">${esc(c.date||'—')}</div>
      <div class="log-entry-note">$${amt.toLocaleString()}</div>
      <button class="rm" onclick="removeDealCollection('${c.id}')" title="刪除">✕</button>
    </div>
  `;
  }).join('') : '<div class="empty-state" style="padding:12px;">尚無領款紀錄</div>';

  const totalCollected = list.reduce((s,c)=>s+(Number(c.personalAmount)||0),0);
  const sumEl = document.getElementById('dealCollectionsSummary');
  if(sumEl) sumEl.textContent = `已領 $${totalCollected.toLocaleString()} / 應領金額 $${expectedCollection.toLocaleString()}（尚未領 $${Math.max(expectedCollection-totalCollected,0).toLocaleString()}）`;
}

function addDealCollection(){
  const date = document.getElementById('dealCollectionDate').value;

function communitySuggestedDate(community){
  const logs = community.sendLogs || [];
  if(logs.length===0) return '';
  const latest = logs.slice().sort((a,b)=>(b.yearMonth||'').localeCompare(a.yearMonth||''))[0];
  if(!latest || !latest.yearMonth) return '';
  const [y,m] = latest.yearMonth.split('-').map(Number);
  const d = new Date(y, m-1, 1);
  d.setMonth(d.getMonth()+6);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

function communityNextSendDate(community){
  return community.nextSendDateOverride || communitySuggestedDate(community);
}

function communityLatestSentDate(community){
  const logs = community.sendLogs || [];
  if(logs.length===0) return '';
  const latest = logs.slice().sort((a,b)=>(b.yearMonth||'').localeCompare(a.yearMonth||''))[0];
  return latest ? latest.yearMonth : '';
}

function nlExtractAgencyCompany(rawText){
  const knownChains = ['信義房屋','永慶房屋','住商不動產','21世紀不動產','21世紀不動產','台灣房屋','東森房屋','中信房屋','有巢氏房屋','大家房屋','太平洋房屋','ERA不動產','591','厚生不動產'];
  for(const chain of knownChains){
    if(rawText.includes(chain)) return chain;
  }
  const m = rawText.match(/([\u4e00-\u9fa5]{2,10}(?:房屋|不動產|仲介))/);
  return m ? m[1] : '';
}

    return DATA.socialMedia.indexOf(b) - DATA.socialMedia.indexOf(a);
  });
  const wrap = document.getElementById('socialMediaListWrap');
  if(list.length===0){ wrap.innerHTML = '<div class="empty-state">還沒有記錄</div>'; return; }

async function saveSocialMedia(){
  const vals = {
    date: document.getElementById('f_smDate').value,
    content: document.getElementById('f_smContent').value.trim(),
    postedTo: Array.from(document.querySelectorAll('.f_sm_posted_cb:checked')).map(cb=>cb.value),
  };
  if(!vals.date){ showToast('請選擇日期'); return false; }

  for(const k of editingCtx.removedPhotoKeys) await deleteStoredFile(k);
  for(const p of editingCtx.tempPhotos){
    if(!p.key){
      const newKey = 'file:social-media:' + uid();
      if(!await saveStoredFile(newKey, p.dataUrl, p.fileName||'自媒體檔案')) return false;
      p.key = newKey;
    }
  }
  vals.mediaKeys = editingCtx.tempPhotos.map(p=>p.key);
  vals.mediaTypes = [...new Set(editingCtx.tempPhotos.map(p=>isVideoDataUrl(p.dataUrl)?'video':(isImageDataUrl(p.dataUrl)?'image':'other')))];

  if(editingCtx.id){
    const idx = DATA.socialMedia.findIndex(l=>l.id===editingCtx.id);
    DATA.socialMedia[idx] = {...DATA.socialMedia[idx], ...vals};
  }else{
    DATA.socialMedia.push({id: uid(), ...vals});
  }
  await saveType('socialMedia');
  return true;
}

function removeCommunitySendLogEditPhoto(logId, idx){
  const log = editingCtx.tempSendLogs.find(l=>l.id===logId);
  if(!log) return;
  const p = log.tempPhotos[idx];
  if(p && p.key) log.removedPhotoKeys.push(p.key);
  log.tempPhotos.splice(idx,1);
  renderCommunitySendLogList();
}
function saveSendLogEdit(logId){
  const log = editingCtx.tempSendLogs.find(l=>l.id===logId);
  if(!log) return;
  const yearMonth = document.getElementById('editSendLogYearMonth-'+logId).value;
  if(!yearMonth){ showToast('請選擇寄送年月'); return; }
  log.yearMonth = yearMonth;
  log.addressType = document.getElementById('editSendLogAddressType-'+logId).value;
  editingCtx.editingSendLogId = null;
  renderCommunitySendLogList();
  resetCommunityNextSendDate();
}

function resetCommunityNextSendDate(){
  const el = document.getElementById('f_communityNextSendDate');
  if(!el) return;
  const hintEl = document.getElementById('communityNextSendAutoHint');
  const logs = editingCtx.tempSendLogs || [];
  if(logs.length===0){
    el.value='';
    if(hintEl) hintEl.textContent = '自動偵測值(最近一次寄送 +6個月):尚無寄送紀錄';
    return;
  }
  const latest = logs.slice().sort((a,b)=>(b.yearMonth||'').localeCompare(a.yearMonth||''))[0];
  if(!latest || !latest.yearMonth){
    el.value='';
    if(hintEl) hintEl.textContent = '自動偵測值(最近一次寄送 +6個月):尚無寄送紀錄';
    return;
  }
  const [y,m] = latest.yearMonth.split('-').map(Number);
  const d = new Date(y, m-1, 1);
  d.setMonth(d.getMonth()+6);
  const computed = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  el.value = computed;
  if(hintEl) hintEl.textContent = `自動偵測值(最近一次寄送 +6個月):${computed}`;
}

async function saveCommunity(){
  if(editingCtx.editingSendLogId){
    saveSendLogEdit(editingCtx.editingSendLogId);
  }
  const pendingYearMonth = document.getElementById('communitySendYearMonth');
  if(pendingYearMonth && pendingYearMonth.value){
    addCommunitySendLog();
  }

  const freshAutoDate = communitySuggestedDate({sendLogs: editingCtx.tempSendLogs.map(l=>({yearMonth:l.yearMonth}))});
  const enteredDate = document.getElementById('f_communityNextSendDate').value;
  const vals = {
    name: document.getElementById('f_communityName').value.trim(),
    region: document.getElementById('f_communityRegion').value,
    totalUnits: document.getElementById('f_communityUnits').value,
    nextSendDateOverride: (enteredDate === freshAutoDate) ? '' : enteredDate,
    notes: document.getElementById('f_communityNotes').value.trim(),
  };
  if(!vals.name){ showToast('請輸入社區名稱'); return false; }

  for(const log of editingCtx.tempSendLogs){
    for(const k of log.removedPhotoKeys) await deleteStoredFile(k);
    for(const p of log.tempPhotos){
      if(!p.key){
        const newKey = 'file:community-send:' + uid();
        if(!await saveStoredFile(newKey, p.dataUrl, p.fileName||'寄送紀錄檔案')) return false;
        p.key = newKey;
      }
    }
    log.photoKeys = log.tempPhotos.map(p=>p.key);
  }
  vals.sendLogs = editingCtx.tempSendLogs.map(l=>({id:l.id, yearMonth:l.yearMonth, addressType:l.addressType, photoKeys:l.photoKeys}));

  if(editingCtx.id){
    const idx = DATA.communities.findIndex(c=>c.id===editingCtx.id);
    DATA.communities[idx] = {...DATA.communities[idx], ...vals};
  }else{
    DATA.communities.push({id: uid(), ...vals});
  }
  await saveType('communities');
  return true;
}

function ptInit(){
  ptDraftEl = document.getElementById('ptDraftText');
  ptPreviewEl = document.getElementById('ptPreviewBody');
  ptGenStatusEl = document.getElementById('ptGenStatus');
  ptCopyStatusEl = document.getElementById('ptCopyStatus');
  ptGenBtnEl = document.getElementById('ptGenBtn');
  ptFieldEls = {
    title: document.getElementById('ptFTitle'),
    price: document.getElementById('ptFPrice'),
    landPing: document.getElementById('ptFLandPing'),
    buildPing: document.getElementById('ptFBuildPing'),
    layout: document.getElementById('ptFLayout'),
    address: document.getElementById('ptFAddress'),
    park: document.getElementById('ptFParkNearby'),
    bus: document.getElementById('ptFBusNearby'),
    conv: document.getElementById('ptFConvNearby'),
    market: document.getElementById('ptFMarketNearby'),
    px: document.getElementById('ptFPxNearby'),
    elementary: document.getElementById('ptFElementaryNearby'),
    juniorHigh: document.getElementById('ptFJuniorHighNearby'),
    desc: document.getElementById('ptFDesc'),
  };
  ptDraftEl.addEventListener('input', ptUpdatePreview);
  ptCurrentPhotos = [];
  ptLoadGroups();
}

function ptUpdatePreview(){
  const v = ptDraftEl.value.trim();
  ptPreviewEl.textContent = v || "在上方產生或輸入文案後，這裡會即時顯示預覽。";
}

function ptEscapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function ptLoadGroups(){
  try{
    const res = await window.storage.get('postGroups', false);
    ptGroups = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    ptGroups = [];
  }
  ptRenderGroups();
}

function ptRenderGroups(){
  const el = document.getElementById('ptGroupList');
  if(!el) return;
  if(!ptGroups.length){
    el.innerHTML = '<div class="pt-hint" style="margin-top:0;">尚未加入任何社團</div>';
    return;
  }
  const postedCount = ptGroups.filter((g,i)=>ptPostedGroupIds.has(i)).length;
  el.innerHTML = `<div class="pt-hint" style="margin-top:0;">這次草稿已開啟 ${postedCount} / ${ptGroups.length} 個社團</div>` + ptGroups.map((g, i) => {
    const posted = ptPostedGroupIds.has(i);
    return `
    <div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);${posted?' opacity:.6;':''}">
      <div style="flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${posted?'✅ ':''}${ptEscapeHtml(g.label || g.url)}</div>
      <button class="pt-btn-brass" style="padding:6px 12px;font-size:12px;" onclick="ptOpenGroupAt(${i})">${posted?'再次開啟':'開啟'}</button>
      <button class="pt-btn-outline" style="padding:6px 10px;font-size:12px;" onclick="ptRemoveGroup(${i})">移除</button>
    </div>
  `;
  }).join('');
}

async function ptSaveGroups(){
  try{ await window.storage.set('postGroups', JSON.stringify(ptGroups), false); }
  catch(e){ showToast('社團清單儲存失敗'); }
}

async function ptAddGroup(){
  const urlInput = document.getElementById('ptGroupUrlInput');
  const labelInput = document.getElementById('ptGroupLabelInput');
  const url = urlInput.value.trim();
  const label = labelInput.value.trim();
  if(!url){
    ptCopyStatusEl.textContent = '請先貼上社團網址';
    ptCopyStatusEl.className = 'pt-status err';
    return;
  }
  ptGroups.push({ url, label });
  await ptSaveGroups();
  urlInput.value = '';
  labelInput.value = '';
  ptRenderGroups();
}

async function ptRemoveGroup(i){
  ptGroups.splice(i, 1);
  await ptSaveGroups();
  ptRenderGroups();
}

function ptOpenGroupAt(i){
  const g = ptGroups[i];
  if(g) window.open(g.url, '_blank');
  ptPostedGroupIds.add(i);
  ptRenderGroups();
}

async function ptLaunchAllGroups(){
  const text = ptDraftEl.value.trim();
  if(!text){
    ptCopyStatusEl.textContent = '目前沒有文案可以複製，請先產生文案';
    ptCopyStatusEl.className = 'pt-status err';
    return;
  }
  if(!ptGroups.length){
    ptCopyStatusEl.textContent = '尚未加入任何社團，請先在下面加入常發的社團網址';
    ptCopyStatusEl.className = 'pt-status err';
    return;
  }
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    ptCopyStatusEl.textContent = '複製失敗，請手動選取文字複製後再試一次';
    ptCopyStatusEl.className = 'pt-status err';
    return;
  }
  let opened = 0, blocked = 0;
  ptGroups.forEach((g, i)=>{
    const w = window.open(g.url, '_blank');
    if(w) opened++; else blocked++;
    ptPostedGroupIds.add(i);
  });
  ptRenderGroups();
  if(blocked > 0){
    ptCopyStatusEl.textContent = `已複製文案，開啟了 ${opened} 個社團分頁，${blocked} 個被瀏覽器擋掉了，請允許彈出視窗後重按一次。每個分頁記得手動貼上(Ctrl+V)並確認後自己送出。`;
    ptCopyStatusEl.className = 'pt-status err';
  }else{
    ptCopyStatusEl.textContent = `已複製文案，開啟了 ${opened} 個社團分頁，到每個分頁貼上(Ctrl+V)並確認後自己送出。`;
    ptCopyStatusEl.className = 'pt-status ok';
  }
}

function ptOpenMapSearch(keyword){
  const address = ptFieldEls.address.value.trim();
  if(!address){
    alert('請先輸入地址');
    return;
  }
  const q = encodeURIComponent(address + ' 附近' + keyword);
  window.open('https://www.google.com/maps/search/' + q + '?hl=zh-TW', '_blank');
}

function ptRenderAddressMapBtn(){
  const wrap = document.getElementById('ptAddressMapBtnWrap');
  if(!wrap) return;
  const address = document.getElementById('ptFAddress').value.trim();
  wrap.innerHTML = address
    ? `<button type="button" class="pt-btn-outline" style="padding:8px 14px;" onclick="window.open('https://www.google.com/maps/search/${encodeURIComponent(address)}?hl=zh-TW','_blank')">📍 在地圖上開啟這個地址</button>`
    : '';
}

function ptToggleSchoolZonePanel(){
  const panel = document.getElementById('ptSchoolZonePanel');
  const willShow = panel.style.display === 'none';
  panel.style.display = willShow ? 'block' : 'none';
  if(willShow) ptRenderSchoolZoneResults();
}

function ptSchoolZoneHighlight(text, keyword){
  if(!keyword) return text;
  const idx = text.indexOf(keyword);
  if(idx === -1) return text;
  return text.slice(0, idx) + '<mark style="background:#F6E3A1;padding:0 2px;">' + text.slice(idx, idx + keyword.length) + '</mark>' + text.slice(idx + keyword.length);
}

function ptRenderSchoolZoneResults(){
  const keyword = document.getElementById('ptVillageInput').value.trim();
  const container = document.getElementById('ptSchoolZoneResults');

  const buildSection = (title, list) => {
    const matched = keyword ? list.filter(s => s.zone.includes(keyword)) : [];
    if(!keyword){
      return `<div class="pt-hint" style="margin-top:0;">輸入村里名稱後，這裡會列出${title}</div>`;
    }
    if(!matched.length) return '';
    return `<div style="font-weight:700;color:var(--brass);font-size:12.5px;margin:8px 0 4px;">${title}</div>` +
      matched.map(s => `
        <div style="border-bottom:1px solid var(--line);padding:8px 0;">
          <div style="font-weight:700;color:var(--jade-deep);font-size:13.5px;">${s.school}　<span style="font-weight:400;color:var(--ink-soft);font-size:11px;">${s.district}</span></div>
          <div style="font-size:12.5px;">${ptSchoolZoneHighlight(s.zone, keyword)}</div>
          <div style="font-size:11px;color:var(--ink-soft);">☎ ${s.phone}</div>
        </div>
      `).join('');
  };

  const elemHtml = buildSection('國小', PT_SCHOOL_ZONE_ELEMENTARY);
  const juniorHtml = buildSection('國中', PT_SCHOOL_ZONE_JUNIOR);

  if(keyword && !elemHtml && !juniorHtml){
    container.innerHTML = `<div class="pt-hint" style="margin-top:0;">沒有找到包含「${keyword}」的村里，目前資料庫只有平鎮區、中壢區，其他區還沒建，或村里名稱打法不同。</div>`;
  } else {
    container.innerHTML = elemHtml + juniorHtml;
  }
}

function ptComposeFromFields(){
  const title = ptFieldEls.title.value.trim();
  const price = ptFieldEls.price.value.trim();
  const landPing = ptFieldEls.landPing.value.trim();
  const buildPing = ptFieldEls.buildPing.value.trim();
  const layout = ptFieldEls.layout.value.trim();
  const desc = ptFieldEls.desc.value.trim();

  const specs = [];
  if(price) specs.push(`💰 售價 ${price}`);
  if(landPing) specs.push(`📐 地坪 ${landPing}`);
  if(buildPing) specs.push(`🏗 建坪 ${buildPing}`);
  if(layout) specs.push(`🏠 格局 ${layout}`);

  const nearbyLines = [];
  const park = ptFieldEls.park.value.trim();
  const bus = ptFieldEls.bus.value.trim();
  const conv = ptFieldEls.conv.value.trim();
  const market = ptFieldEls.market.value.trim();
  const px = ptFieldEls.px.value.trim();
  const elementary = ptFieldEls.elementary.value.trim();
  const juniorHigh = ptFieldEls.juniorHigh.value.trim();
  if(park) nearbyLines.push(`🌳 公園：${park}`);
  if(bus) nearbyLines.push(`🚌 公車站：${bus}`);
  if(conv) nearbyLines.push(`🏪 超商：${conv}`);
  if(market) nearbyLines.push(`🛍 賣場：${market}`);
  if(px) nearbyLines.push(`🛒 全聯：${px}`);
  if(elementary) nearbyLines.push(`🏫 國小：${elementary}`);
  if(juniorHigh) nearbyLines.push(`🏫 國中：${juniorHigh}`);

  const parts = [];
  if(title) parts.push(title);
  if(specs.length) parts.push(specs.join('\n'));
  if(desc) parts.push(desc);
  if(nearbyLines.length) parts.push(`📍 生活機能\n${nearbyLines.join('\n')}`);
  parts.push(PT_SIGNOFF);

  ptDraftEl.value = parts.join('\n\n');
  ptUpdatePreview();
  ptCopyStatusEl.textContent = '已用欄位組成文案，可在下方繼續編輯。';
  ptCopyStatusEl.className = 'pt-status ok';
}

function ptCleanPing(v){
  if(!v) return '';
  return v.replace(/(\d+)\.\d+/g, '$1');
}
function ptCleanLayout(v){
  if(!v) return '';
  return v.replace(/[（(]室[)）]/g, '');
}
function ptCleanDescription(v){
  if(!v) return '';
  if(v.includes('\n')) return v;
  return v.replace(/。(?!$)/g, '。\n');
}

function ptFillFields(f){
  ptFieldEls.title.value = f.title || '';
  ptFieldEls.price.value = f.price || '';
  ptFieldEls.landPing.value = ptCleanPing(f.land_ping);
  ptFieldEls.buildPing.value = ptCleanPing(f.building_ping);
  ptFieldEls.layout.value = ptCleanLayout(f.layout);
  ptFieldEls.address.value = f.address || '';
  ptFieldEls.desc.value = ptCleanDescription(f.description);
  ptRenderAddressMapBtn();
}

function ptExtractImageUrls(rawText){
  const urls = new Set();
  for(const m of rawText.matchAll(/!\[[^\]]*\]\((https?:\/\/[^\s\)]+)\)/g)){
    urls.add(m[1]);
  }
  for(const m of rawText.matchAll(/https?:\/\/[^\s"'<>\)]+?\.(?:jpg|jpeg|png|webp|gif|jfif)(?:\?[^\s"'<>\)]*)?/gi)){
    urls.add(m[0]);
  }
  for(const m of rawText.matchAll(/(?:src|data-src|data-original|data-lazy)\s*=\s*["'](https?:\/\/[^\s"']+?\.(?:jpg|jpeg|png|webp|gif|jfif)(?:\?[^\s"']*)?)["']/gi)){
    urls.add(m[1]);
  }
  return [...urls]
    .filter(u => !/logo|icon|sprite|avatar|favicon/i.test(u))
    .slice(0, 24);
}

async function ptFetchReadablePageText(url){
  const readerUrl = 'https://r.jina.ai/' + url;
  const res = await fetch(readerUrl);
  if(!res.ok) throw new Error(`網頁讀取服務回應錯誤 (狀態碼 ${res.status})`);
  const text = await res.text();
  if(!text || text.trim().length < 20) throw new Error('讀取到的網頁內容是空的，該網址可能需要登入或封鎖了自動讀取');
  if(/(?:error 403|forbidden|request blocked|cloudfront|access denied|驗證碼|captcha)/i.test(text.slice(0, 800))){
    throw new Error('這個網站擋掉了自動讀取（防機器人保護），沒辦法自動抓取任何欄位或照片，請直接手動輸入資料');
  }
  return text.trim();
}

function ptExtractFieldsWithRegex(rawText){
  const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
  let title = lines.find(l => l.length > 4 && l.length < 80) || '';
  title = title.replace(/^title\s*[:：]\s*/i, '').trim();

  const priceMatch = rawText.match(/(\d{2,5}(?:\.\d+)?\s*萬)/);

  const landMatch =
    rawText.match(/地坪\s*[:：]?\s*(\d+(?:\.\d+)?\s*坪)/) ||
    rawText.match(/土地(?:面積|坪數)?\s*[:：]?\s*(\d+(?:\.\d+)?\s*坪)/);

  const buildMatch =
    rawText.match(/主建\s*[:：]?\s*(\d+(?:\.\d+)?\s*坪)/) ||
    rawText.match(/建坪\s*[:：]?\s*(\d+(?:\.\d+)?\s*坪)/) ||
    rawText.match(/(?:主建物|建物面積|權狀坪數|房屋坪數)\s*[:：]?\s*(\d+(?:\.\d+)?\s*坪)/);

  const layoutMatch =
    rawText.match(/(\d\s*房\s*\d\s*廳\s*\d?\s*衛?)/) ||
    rawText.match(/(\d\s*[房室]\s*\d\s*廳)/) ||
    rawText.match(/格局\s*[:：]?\s*([^\n]{2,12}(?:房|室)[^\n]{0,10})/);

  const addressMatch =
    rawText.match(/地址\s*[:：]?\s*([^\n]{6,40}(?:路|街|大道)[^\n]{0,20}?\d+[^\n]{0,10})/) ||
    rawText.match(/([\u4e00-\u9fa5]{2,3}[縣市][\u4e00-\u9fa5]{2,4}[區鄉鎮市][^\n]{2,20}(?:路|街|大道)[^\n]{0,20}?\d+[^\n]{0,10})/);

  let desc = '';
  const starSections = [...rawText.matchAll(/★\s*(?:房屋)?(?:環境|交通|屋況|特色|格局|介紹)[:：]?\s*([\s\S]{10,300}?)(?=★|\n\n|$)/g)]
    .map(m => m[1].trim())
    .filter(Boolean);
  if(starSections.length){
    desc = starSections.join('\n');
  } else {
    const descHeadMatch = rawText.match(
      /(?:房屋描述|屋況介紹|物件描述|特色描述|物件特色|房屋說明|物件說明|物件亮點|屋況特色|生活機能|仲介口述|心得分享|文案|備註)[:：]?\s*([\s\S]{20,300}?)(?:\n\n|$)/
    );
    if(descHeadMatch){
      desc = descHeadMatch[1].trim();
    } else {
      const paragraphs = rawText.split(/\n{2,}/).map(p => p.trim()).filter(Boolean);
      const prose = paragraphs
        .filter(p => p.length > 40 && p.length < 400 && !/^(title|url|source)\s*[:：]/i.test(p))
        .sort((a, b) => b.length - a.length)[0];
      if(prose) desc = prose.slice(0, 300);
    }
  }

  return {
    title,
    price: priceMatch ? priceMatch[1].replace(/\s+/g,'') : '',
    land_ping: landMatch ? landMatch[1].replace(/\s+/g,'') : '',
    building_ping: buildMatch ? buildMatch[1].replace(/\s+/g,'') : '',
    layout: layoutMatch ? layoutMatch[1].replace(/\s+/g,'') : '',
    address: addressMatch ? addressMatch[1].replace(/\s+/g,'') : '',
    description: desc,
  };
}

async function ptExtractFieldsWithAI(rawText, url){
  const trimmed = rawText.slice(0, 6000);
  const prompt = `以下是從房屋物件網頁 ${url} 擷取到的內容：

---
${trimmed}
---

請從中找出以下欄位，找不到的欄位請填空字串，絕對不要編造內容：
- title：物件標題
- price：售價（含「萬」字，例如「888萬」）
- land_ping：地坪（含「坪」字）
- building_ping：建坪（含「坪」字）
- layout：格局（例如「3房2廳2衛」）
- address：完整地址（含縣市、區、路名、門牌），找不到就填空字串，絕對不要編造
- description：房屋描述／屋況／賣點，濃縮成 150-250 字繁體中文。原文如果分成好幾段或好幾個重點，請保留這個分段，段落之間用 \n 換行符號隔開，不要擠成一整段

只回傳一個 JSON 物件，不要任何前言、說明或 markdown 符號，格式如下：
{"title":"","price":"","land_ping":"","building_ping":"","layout":"","address":"","description":""}`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 800,
      messages: [{ role: "user", content: prompt }]
    })
  });

  if(!response.ok) throw new Error(`AI 擷取服務回應錯誤 (狀態碼 ${response.status})`);
  const data = await response.json();
  if(data.error) throw new Error(data.error.message || 'AI 擷取服務錯誤');

  const text = (data.content || [])
    .map(b => b.type === 'text' ? b.text : '')
    .filter(Boolean)
    .join('\n')
    .trim();

  const cleaned = text.replace(/```json|```/g, '').trim();
  const parsed = JSON.parse(cleaned);
  return parsed;
}

async function ptGenerateDraft(){
  const url = document.getElementById('ptUrlInput').value.trim();
  if(!url){
    ptGenStatusEl.textContent = '請先貼上物件網址';
    ptGenStatusEl.className = 'pt-status err';
    return;
  }
  ptPostedGroupIds = new Set();
  ptRenderGroups();
  ptGenBtnEl.disabled = true;
  ptGenStatusEl.innerHTML = '<span class="pt-spinner"></span>正在讀取網頁內容...';
  ptGenStatusEl.className = 'pt-status';

  let rawText;
  try{
    rawText = await ptFetchReadablePageText(url);
  }catch(e){
    console.error(e);
    ptGenStatusEl.textContent = '讀取網頁失敗：' + (e && e.message ? e.message : '未知錯誤') + '。請確認網址正確、頁面公開可瀏覽，或換一個網址再試。';
    ptGenStatusEl.className = 'pt-status err';
    ptGenBtnEl.disabled = false;
    return;
  }

  ptGenStatusEl.innerHTML = '<span class="pt-spinner"></span>網頁已讀取，正在擷取照片與欄位...';

  const photos = ptExtractImageUrls(rawText);
  ptRenderPhotoGrid(photos);

  let fields;
  let usedAI = true;
  try{
    fields = await ptExtractFieldsWithAI(rawText, url);
  }catch(e){
    console.error(e);
    usedAI = false;
    fields = ptExtractFieldsWithRegex(rawText);
  }

  ptFillFields(fields);
  ptComposeFromFields();

  ptGenStatusEl.textContent = '';
  ptGenStatusEl.className = 'pt-status';
  ptGenBtnEl.disabled = false;
}

async function ptCopyDraft(){
  const text = ptDraftEl.value.trim();
  if(!text){
    ptCopyStatusEl.textContent = '目前沒有文案可以複製';
    ptCopyStatusEl.className = 'pt-status err';
    return;
  }
  try{
    await navigator.clipboard.writeText(text);
    ptCopyStatusEl.textContent = '已複製，接下來可以貼到社團貼文框。';
    ptCopyStatusEl.className = 'pt-status ok';
  }catch(e){
    ptCopyStatusEl.textContent = '複製失敗，請手動選取文字複製。';
    ptCopyStatusEl.className = 'pt-status err';
  }
}

function findDutyLogForDate(dutyClient, dateStr){
  if(!dutyClient || !dutyClient.serviceLogs) return null;
  return dutyClient.serviceLogs.find(l=>l.date===dateStr && l.type==='值班') || null;
}
function findDutyLogForDateShift(dutyClient, dateStr, shiftType){
  if(!dutyClient || !dutyClient.serviceLogs) return null;
  return dutyClient.serviceLogs.find(l=>l.date===dateStr && l.type==='值班' && guessShiftTypeFromLog(l)===shiftType) || null;
}
function guessShiftTypeFromLog(log){
  if(!log || !log.note) return '';
  if(log.note.startsWith('早班')) return '早班';
  if(log.note.startsWith('中班')) return '中班';
  if(log.note.startsWith('晚班')) return '晚班';
  return '';
}

function renderDutyRosterGrid(){
  const grid = document.getElementById('dutyRosterDayGrid');
  if(!grid) return;
  const year = calendarMonth.getFullYear();
  const month = calendarMonth.getMonth();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const weekdayNames = ['日','一','二','三','四','五','六'];
  const dutyClient = getDutyRosterClient();
  const SHIFT_TYPES = ['早班','中班','晚班'];
  let html = '';
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow = new Date(year, month, d).getDay();
    const shiftsChecked = SHIFT_TYPES.filter(st=>findDutyLogForDateShift(dutyClient, dateStr, st));
    const hasMeeting = !!(dutyClient && dutyClient.serviceLogs && dutyClient.serviceLogs.find(l=>l.date===dateStr && l.type==='月會'));
    html += `<div style="display:flex; align-items:center; gap:8px; padding:6px 4px; border-bottom:1px solid var(--line); flex-wrap:wrap; ${shiftsChecked.length||hasMeeting?'background:var(--stone);':''}">
      <div style="width:64px; font-size:12px; color:var(--ink-soft); flex-shrink:0;">${month+1}/${d}（${weekdayNames[dow]}）</div>
      <div style="display:flex; gap:10px; flex:1; flex-wrap:wrap;">
        ${SHIFT_TYPES.map(st=>`<label style="display:flex; align-items:center; gap:4px; font-size:12px; white-space:nowrap;">
          <input type="checkbox" class="duty-day-shift-cb" data-date="${dateStr}" data-shift="${st}" ${shiftsChecked.includes(st)?'checked':''}> ${st}
        </label>`).join('')}
      </div>
      <label style="display:flex; align-items:center; gap:4px; font-size:12px; flex-shrink:0; white-space:nowrap;">
        <input type="checkbox" class="duty-day-meeting-cb" data-date="${dateStr}" ${hasMeeting?'checked':''}> 月會
      </label>
    </div>`;
  }
  grid.innerHTML = html;
}

function getDutyRosterClient(){
  const c = DATA.clients.find(c=>c.isDutyRosterClient);
  if(c && c.name === '📋 值班表'){ c.name = '📋 個人行程'; saveType('clients'); }
  return c;
}

function getOrCreatePersonalScheduleClient(){
  let c = getDutyRosterClient();
  if(!c){
    c = { id: uid(), name: '📋 個人行程', phones:[], types:[], statuses:[], isDutyRosterClient: true, serviceLogs:[] };
    DATA.clients.push(c);
  }
  if(!c.serviceLogs) c.serviceLogs = [];
  return c;
}

async function generateLandGodEvents(){
  const dates = generateLandGodDates(24);
  if(dates.length===0){ showToast('產生失敗,請稍後再試'); return; }
  const client = getOrCreatePersonalScheduleClient();
  const existingDates = new Set((client.serviceLogs||[]).filter(l=>l.type==='土地公拜拜').map(l=>l.date));
  let added = 0;

0x0d520];
const LUNAR_SOLAR_MONTH_DAYS = [31,28,31,30,31,30,31,31,30,31,30,31];

function lunarLeapMonth(y){ return LUNAR_INFO[y-1900] & 0xf; }
function lunarLeapDays(y){ return lunarLeapMonth(y) ? ((LUNAR_INFO[y-1900] & 0x10000) ? 30 : 29) : 0; }
function lunarMonthDays(y,m){ if(m>12||m<1) return -1; return (LUNAR_INFO[y-1900] & (0x10000>>m)) ? 30 : 29; }
function lunarYearDays(y){
  let sum = 348;
  for(let i=0x8000; i>0x8; i>>=1){ sum += (LUNAR_INFO[y-1900] & i) ? 1 : 0; }
  return sum + lunarLeapDays(y);
}

function solarToLunar(y,m,d){
  if(y<1900||y>2100) return null;
  const objDate = new Date(y, m-1, d);
  y = objDate.getFullYear(); m = objDate.getMonth()+1; d = objDate.getDate();
  let offset = Math.round((Date.UTC(y,m-1,d) - Date.UTC(1900,0,31))/86400000);
  let i, temp=0;
  for(i=1900; i<2101 && offset>0; i++){ temp = lunarYearDays(i); offset -= temp; }
  if(offset<0){ offset += temp; i--; }
  const year = i;
  const leap = lunarLeapMonth(i);
  let isLeap = false;
  for(i=1; i<13 && offset>0; i++){
    if(leap>0 && i===(leap+1) && !isLeap){ --i; isLeap = true; temp = lunarLeapDays(year); }
    else{ temp = lunarMonthDays(year, i); }
    if(isLeap && i===(leap+1)){ isLeap = false; }
    offset -= temp;
  }
  if(offset===0 && leap>0 && i===leap+1){
    if(isLeap){ isLeap=false; } else { isLeap=true; --i; }
  }
  if(offset<0){ offset += temp; --i; }
  return { lYear: year, lMonth: i, lDay: offset+1, isLeap };
}

function lunarToSolar(y,m,d,isLeapMonth){
  isLeapMonth = !!isLeapMonth;
  const leapMonth = lunarLeapMonth(y);
  if(isLeapMonth && leapMonth!==m) return null;
  if((y===2100&&m===12&&d>1) || (y===1900&&m===1&&d<31)) return null;
  let day = lunarMonthDays(y,m);
  let _day = day;
  if(isLeapMonth){ _day = lunarLeapDays(y); }
  if(y<1900||y>2100||d>_day) return null;
  let offset = 0;
  for(let yy=1900; yy<y; yy++){ offset += lunarYearDays(yy); }
  let leap=0, isAdd=false;
  for(let mm=1; mm<m; mm++){
    leap = lunarLeapMonth(y);
    if(!isAdd){ if(leap<=mm && leap>0){ offset += lunarLeapDays(y); isAdd = true; } }
    offset += lunarMonthDays(y, mm);
  }
  if(isLeapMonth){ offset += day; }
  const stmap = Date.UTC(1900,1,30,0,0,0);
  const calObj = new Date((offset+d-31)*86400000 + stmap);
  return { year: calObj.getUTCFullYear(), month: calObj.getUTCMonth()+1, day: calObj.getUTCDate() };
}

function generateLandGodDates(monthsAhead){
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  const todayLunar = solarToLunar(today.getFullYear(), today.getMonth()+1, today.getDate());
  if(!todayLunar) return [];
  const results = [];
  let ly = todayLunar.lYear, lm = todayLunar.lMonth;
  for(let i=0; i<monthsAhead; i++){
    [2,16].forEach(ld=>{
      const solar = lunarToSolar(ly, lm, ld, false);
      if(solar){
        const d = new Date(solar.year, solar.month-1, solar.day);
        if(d.getDay() === 0){ d.setDate(d.getDate()-1); }
        const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        if(dateStr >= todayStr) results.push(dateStr);
      }
    });
    lm++;
    if(lm>12){ lm=1; ly++; }
  }
  return results;
}

const DUTY_SHIFT_SCHEDULE = {
  weekday: {
    '早班': { start:'09:30', end:'13:00' },
    '中班': { start:'13:00', end:'17:00' },
    '晚班': { start:'17:00', end:'20:00' },
  },
  sunday: {
    '早班': { start:'09:30', end:'12:00' },
    '中班': { start:'12:00', end:'15:00' },
    '晚班': { start:'15:00', end:'18:00' },
  },
};
const DUTY_TRASH_TIME = { 0: null, 1: '17:20', 2: '19:30', 3: null, 4: '17:20', 5: '19:30', 6: '19:30' };

function getDutyShiftInfo(dateStr, shiftType){
  const dow = new Date(dateStr + 'T00:00:00').getDay();
  const sched = dow === 0 ? DUTY_SHIFT_SCHEDULE.sunday : DUTY_SHIFT_SCHEDULE.weekday;
  const times = sched[shiftType];
  let note = `${shiftType} ${times.start}-${times.end}`;
  if(shiftType === '晚班'){
    const trash = DUTY_TRASH_TIME[dow];
    if(trash) note += `，垃圾車 ${trash}`;
  }
  return { time: times.start, endTime: times.end, note };
}

async function dutyRosterSubmit(){
  const shiftCbs = Array.from(document.querySelectorAll('.duty-day-shift-cb'));
  const meetingCbs = Array.from(document.querySelectorAll('.duty-day-meeting-cb'));
  if(shiftCbs.length===0 && meetingCbs.length===0) return;

  const dutyClient = getOrCreatePersonalScheduleClient();

  let addedCount = 0, updatedCount = 0, removedCount = 0;
  const toDeleteFromGcal = [];

  shiftCbs.forEach(cb=>{
    const dateStr = cb.dataset.date;
    const shift = cb.dataset.shift;
    const checked = cb.checked;
    const existingIdx = dutyClient.serviceLogs.findIndex(l=>l.date===dateStr && l.type==='值班' && guessShiftTypeFromLog(l)===shift);
    if(!checked){
      if(existingIdx !== -1){
        const removed = dutyClient.serviceLogs[existingIdx];
        dutyClient.serviceLogs.splice(existingIdx,1);
        removedCount++;
        if(removed.gcalEventId) toDeleteFromGcal.push(removed.gcalEventId);
      }
      return;
    }
    const info = getDutyShiftInfo(dateStr, shift);
    const note = info.note;
    if(existingIdx !== -1){
      const existing = dutyClient.serviceLogs[existingIdx];
      const changed = existing.time !== info.time || existing.endTime !== info.endTime || existing.note !== note;
      if(changed){
        existing.time = info.time;
        existing.endTime = info.endTime;
        existing.note = note;
        updatedCount++;
      }
    }else{
      dutyClient.serviceLogs.push({ id: uid(), date: dateStr, time: info.time, endTime: info.endTime, type: '值班', note });
      addedCount++;
    }
  });

  meetingCbs.forEach(cb=>{
    const dateStr = cb.dataset.date;
    const checked = cb.checked;
    const existingIdx = dutyClient.serviceLogs.findIndex(l=>l.date===dateStr && l.type==='月會');
    if(checked && existingIdx===-1){
      dutyClient.serviceLogs.push({ id: uid(), date: dateStr, time:'', type:'月會', note:'月會' });
      addedCount++;
    }else if(!checked && existingIdx!==-1){
      const removed = dutyClient.serviceLogs[existingIdx];
      dutyClient.serviceLogs.splice(existingIdx,1);
      removedCount++;
      if(removed.gcalEventId) toDeleteFromGcal.push(removed.gcalEventId);
    }
  });

  await saveType('clients');
  for(const gid of toDeleteFromGcal){ await gcalAutoDeleteEvent(gid); }
  gcalAutoSyncClient(dutyClient.id);

  const parts = [];
  if(addedCount) parts.push(`新增 ${addedCount} 筆`);
  if(updatedCount) parts.push(`更新 ${updatedCount} 筆`);
  if(removedCount) parts.push(`移除 ${removedCount} 筆`);
  showToast(parts.length ? parts.join('、') : '沒有變更');
  drawCalendar();
  renderDutyRosterGrid();
  updateLandGodWarning();
  updateCardWarning();
}

function drawCalendar(){
  const year = calendarMonth.getFullYear();
  const month = calendarMonth.getMonth();
  document.getElementById('calLabel').textContent = `${year} 年 ${month+1} 月`;

  const events = {};
  DATA.clients.forEach(c=>{
    (c.serviceLogs||[]).forEach(l=>{
      if(!l.date) return;
      if(!events[l.date]) events[l.date] = [];
      events[l.date].push({clientId:c.id, logId:l.id, clientName:c.name, time:l.time||'', note:l.note||'', type:l.type||'', completed:!!l.completed});
    });
  });

  const firstDay = new Date(year, month, 1);
  const startWeekday = (firstDay.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0,10);

  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div class="cal-cell cal-empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayEvents = (events[dateStr]||[]).slice().sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    const isToday = dateStr === todayStr;
    const doneCount = dayEvents.filter(e=>e.completed).length;
    const allDone = dayEvents.length>0 && doneCount===dayEvents.length;
    const hasImportant = dayEvents.some(e=>!CALENDAR_ROUTINE_TYPES.includes(e.type) && !e.completed);
    cells += `<div class="cal-cell ${isToday?'cal-today':''}" style="${allDone?'opacity:0.45;':''}${dayEvents.length?'cursor:pointer;':''}" ${dayEvents.length?`onclick="openDayAgenda('${dateStr}')"`:''}>
      <div class="cal-daynum">${d}</div>
      ${dayEvents.length ? `<div class="cal-event-count${hasImportant?' cal-event-count-important':''}">${dayEvents.length} 個行程${doneCount?` · ${doneCount}已完成`:''}</div>` : ''}
    </div>`;
  }

  document.getElementById('calGrid').innerHTML = `
    <div class="cal-weekdays"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div>
    <div class="cal-grid">${cells}</div>
  `;
}

function icsEscape(s){
  return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}
function icsPad(n){ return String(n).padStart(2,'0'); }
function buildICSEvent(title, dateStr, timeStr, description){
  let dtStartLine, dtEndLine;
  if(timeStr){
    const start = new Date(dateStr + 'T' + timeStr + ':00');
    const end = new Date(start.getTime() + 60*60*1000);
    const fmt = d => `${d.getFullYear()}${icsPad(d.getMonth()+1)}${icsPad(d.getDate())}T${icsPad(d.getHours())}${icsPad(d.getMinutes())}00`;
    dtStartLine = `DTSTART:${fmt(start)}`;
    dtEndLine = `DTEND:${fmt(end)}`;
  }else{
    const flat = dateStr.replace(/-/g,'');
    dtStartLine = `DTSTART;VALUE=DATE:${flat}`;
    dtEndLine = `DTEND;VALUE=DATE:${flat}`;
  }
  return [
    'BEGIN:VEVENT',
    `UID:${Date.now()}-${Math.random().toString(36).slice(2)}@yaci-realty`,
    `DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').split('.')[0]}Z`,
    dtStartLine,
    dtEndLine,
    `SUMMARY:${icsEscape(title)}`,
    description ? `DESCRIPTION:${icsEscape(description)}` : '',
    'END:VEVENT'
  ].filter(Boolean).join('\r\n');
}
function buildICSFile(vevents){
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//雅慈工作台//行事曆匯出//ZH','CALSCALE:GREGORIAN', ...vevents, 'END:VCALENDAR'].join('\r\n');
}
function downloadICSFile(filename, content){
  const blob = new Blob([content], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

}

/* ===================== Google Calendar sync (OAuth, no public URL) ===================== */
let gcalAccessToken = null;
let gcalTokenClient = null;
let gcalRefreshTimer = null;

function gcalSignIn(){
  const clientId = document.getElementById('gcalClientIdInput').value.trim();
  if(!clientId){ showToast('請先貼上 Google Client ID'); return; }
  localStorage.setItem('gcal_client_id', clientId);
  gcalRequestToken(clientId, false);
}

function gcalRequestToken(clientId, silent){
  if(typeof google === 'undefined' || !google.accounts){
    if(!silent) showToast('Google 登入元件還沒載入完成，請稍等幾秒再試一次');
    return;
  }
  gcalTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: clientId,
    scope: 'https://www.googleapis.com/auth/calendar.events',
    callback: (resp)=>{
      if(resp.error){
        if(!silent) showToast('登入失敗：' + resp.error);
        return;
      }
      gcalAccessToken = resp.access_token;
      const statusEl = document.getElementById('gcalStatus');
      const btnEl = document.getElementById('gcalSyncBtn');
      if(statusEl) statusEl.textContent = '已登入 Google，可以同步';
      if(btnEl) btnEl.disabled = false;
      if(!silent) showToast('已登入 Google');
      /* Google access tokens typically expire after ~1 hour. Proactively refresh every 45 minutes so a long-open tab doesn't quietly go stale. */
      if(gcalRefreshTimer) clearInterval(gcalRefreshTimer);
      gcalRefreshTimer = setInterval(()=>{ gcalRequestToken(clientId, true); }, 45*60*1000);
    },
  });
  gcalTokenClient.requestAccessToken(silent ? { prompt: '' } : {});
}

/* Try to silently re-authenticate on page load if a Client ID is already saved and this browser previously granted access. May not always succeed — Google can still require a click depending on session state. */
function gcalTryAutoSignIn(){
  const clientId = localStorage.getItem('gcal_client_id');
  if(!clientId) return;
  let attempts = 0;
  const tryNow = ()=>{
    attempts++;
    if(typeof google !== 'undefined' && google.accounts){
      gcalRequestToken(clientId, true);
    }else if(attempts < 10){
      setTimeout(tryNow, 300);
    }
  };
  tryNow();
}

}

function gcalFormatLocalDateTime(d){
  return `${d.getFullYear()}-${icsPad(d.getMonth()+1)}-${icsPad(d.getDate())}T${icsPad(d.getHours())}:${icsPad(d.getMinutes())}:00`;
}

const GCAL_TYPE_COLOR_ID = {
  '買方聯絡': '9',
  '賣方聯絡': '9',
  '土地公拜拜': '8',
};
/* 這些類型只顯示在 App 內的行事曆，不會同步到 Google 日曆 */
const GCAL_NO_SYNC_TYPES = ['買方聯絡','賣方聯絡'];

function gcalBuildEventBody(client, l){
  const trashMatch = l.note && l.note.match(/垃圾車\s*[\d:：]+/);
  const addresses = logItemAddresses(l);
  const addressSuffix = addresses.length ? ` (${addresses.join('、')})` : '';
  const summary = client.isDutyRosterClient
    ? `${l.type||'行程'}${trashMatch ? ' ' + trashMatch[0] : ''}`
    : `${l.type||'行程'} - ${client.name}${addressSuffix}${trashMatch ? ' ' + trashMatch[0] : ''}`;
  const NO_REMINDER_TYPES = ['買方聯絡','賣方聯絡'];
  let reminders;
  if(NO_REMINDER_TYPES.includes(l.type)){
    reminders = { useDefault: false, overrides: [] };
  }else{
    const reminderMinutes = gcalGetReminderMinutes();
    reminders = reminderMinutes === 'default'
      ? { useDefault: true }
      : { useDefault: false, overrides: [{ method: 'popup', minutes: parseInt(reminderMinutes, 10) }] };
  }
  const colorId = GCAL_TYPE_COLOR_ID[l.type] || '11';
  if(l.time){
    const start = new Date(l.date + 'T' + l.time + ':00');
    const endOfDay = new Date(start);
    endOfDay.setHours(23, 59, 0, 0);
    let candidateEnd;
    if(l.endTime){
      candidateEnd = new Date(l.date + 'T' + l.endTime + ':00');
      if(candidateEnd <= start) candidateEnd = new Date(start.getTime() + 60*60*1000);
    }else{
      candidateEnd = new Date(start.getTime() + 60*60*1000);
    }
    const end = candidateEnd > endOfDay ? endOfDay : candidateEnd;
    return {
      summary,
      description: [addresses.length?'📍 '+addresses.join('、'):'', l.note||''].filter(Boolean).join('\n'),
      start: { dateTime: gcalFormatLocalDateTime(start), timeZone: 'Asia/Taipei' },
      end: { dateTime: gcalFormatLocalDateTime(end), timeZone: 'Asia/Taipei' },
      reminders,
      ...(colorId ? {colorId} : {}),
    };
  }
  const nextDay = new Date(l.date + 'T00:00:00');
  nextDay.setDate(nextDay.getDate() + 1);
  const nextDayStr = `${nextDay.getFullYear()}-${icsPad(nextDay.getMonth()+1)}-${icsPad(nextDay.getDate())}`;
  return {
    summary,
    description: [addresses.length?'📍 '+addresses.join('、'):'', l.note||''].filter(Boolean).join('\n'),
    start: { date: l.date },
    end: { date: nextDayStr },
    reminders,
    ...(colorId ? {colorId} : {}),
  };
}

/* Silent, targeted sync for one client's logs — used to auto-sync right after a save, without needing the manual button. Does nothing if not signed in. */
async function gcalAutoSyncClient(clientId){
  if(!gcalAccessToken || !clientId) return;
  const client = DATA.clients.find(c=>c.id===clientId);
  if(!client) return;
  let dataChanged = false;
  let failed = false;
  for(const log of (client.serviceLogs||[])){
    if(!log.date) continue;
    if(GCAL_NO_SYNC_TYPES.includes(log.type)){
      if(log.gcalEventId){
        await gcalAutoDeleteEvent(log.gcalEventId);
        log.gcalEventId = null;
        dataChanged = true;
      }
      continue;
    }
    const body = gcalBuildEventBody(client, log);
    try{
      if(log.gcalEventId){
        const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${log.gcalEventId}`, {
          method: 'PATCH',
          headers: { 'Authorization': 'Bearer ' + gcalAccessToken, 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          keepalive: true
        });
        if(!res.ok){ if(res.status===401) gcalHandleExpiredToken(); failed = true; }
      }else{
        const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + gcalAccessToken, 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          keepalive: true
        });
        if(res.ok){
          const data = await res.json();
          log.gcalEventId = data.id;
          dataChanged = true;
        }else{
          if(res.status===401) gcalHandleExpiredToken();
          failed = true;
        }
      }
    }catch(e){ console.error(e); failed = true; }
  }
  if(dataChanged) await saveType('clients');
  const statusEl = document.getElementById('gcalStatus');
  if(statusEl && gcalAccessToken){
    statusEl.textContent = failed
      ? '同步時發生錯誤，部分行程可能沒有同步成功'
      : '已自動同步（' + new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}) + '）';
  }
}

function gcalHandleExpiredToken(){
  gcalAccessToken = null;
  const statusEl = document.getElementById('gcalStatus');
  const btnEl = document.getElementById('gcalSyncBtn');
  if(statusEl) statusEl.textContent = 'Google 登入已過期，請重新按「登入 Google」';
  if(btnEl) btnEl.disabled = true;
  showToast('Google 登入已過期，同步已暫停，請重新登入');
}

async function gcalAutoDeleteEvent(gcalEventId){
  if(!gcalAccessToken || !gcalEventId) return;
  try{
    const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${gcalEventId}`, {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + gcalAccessToken },
      keepalive: true
    });
    if(!res.ok && res.status !== 410 && res.status !== 404){
      if(res.status===401){ gcalHandleExpiredToken(); return; }
      showToast('Google 日曆行程刪除失敗（狀態碼 ' + res.status + '），可能需要手動到 Google 日曆刪除');
    }
  }catch(e){
    console.error(e);
    showToast('Google 日曆行程刪除失敗，可能需要手動到 Google 日曆刪除');
  }
}

async function gcalCleanupContactEvents(){
  if(!gcalAccessToken){ showToast('請先登入 Google'); return; }
  const btnEl = document.getElementById('gcalCleanupBtn');
  const statusEl = document.getElementById('gcalStatus');
  btnEl.disabled = true;
  if(statusEl) statusEl.textContent = '搜尋中，請稍候…';

  let deleted = 0, failed = 0;

  for(const keyword of GCAL_NO_SYNC_TYPES){
    let pageToken = '';
    do{
      try{
        const url = new URL('https://www.googleapis.com/calendar/v3/calendars/primary/events');
        url.searchParams.set('q', keyword);
        url.searchParams.set('maxResults', '250');
        url.searchParams.set('showDeleted', 'false');
        if(pageToken) url.searchParams.set('pageToken', pageToken);
        const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + gcalAccessToken } });
        if(!res.ok){
          if(res.status===401){ gcalHandleExpiredToken(); return; }
          failed++;
          break;
        }
        const data = await res.json();
        const items = data.items || [];
        for(const ev of items){
          const summary = ev.summary || '';
          if(!summary.startsWith(keyword)) continue;
          try{
            const delRes = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${ev.id}`, {
              method: 'DELETE',
              headers: { 'Authorization': 'Bearer ' + gcalAccessToken }
            });
            if(delRes.ok || delRes.status===410 || delRes.status===404) deleted++;
            else failed++;
          }catch(e){ console.error(e); failed++; }
        }
        pageToken = data.nextPageToken || '';
      }catch(e){
        console.error(e);
        failed++;
        break;
      }
    }while(pageToken);
  }

  let dataChanged = false;
  for(const client of DATA.clients){
    for(const log of (client.serviceLogs||[])){
      if(GCAL_NO_SYNC_TYPES.includes(log.type) && log.gcalEventId){
        log.gcalEventId = null;
        dataChanged = true;
      }
    }
  }
  if(dataChanged) await saveType('clients');

  btnEl.disabled = false;
  if(statusEl) statusEl.textContent = `清除完成：移除 ${deleted} 筆${failed?`、失敗 ${failed} 筆`:''}`;
  showToast(`清除完成：從 Google 日曆移除 ${deleted} 筆買方/賣方聯絡${failed?`，${failed} 筆失敗`:''}`);
}

async function gcalSyncEvents(){
  if(!gcalAccessToken){ showToast('請先登入 Google'); return; }
  document.getElementById('gcalSyncBtn').disabled = true;
  document.getElementById('gcalStatus').textContent = '同步中，請稍候…';

  let created = 0, updated = 0, failed = 0, deleted = 0, dataChanged = false;

  for(const client of DATA.clients){
    for(const log of (client.serviceLogs||[])){
      if(!log.date) continue;
      if(GCAL_NO_SYNC_TYPES.includes(log.type)){
        if(log.gcalEventId){
          await gcalAutoDeleteEvent(log.gcalEventId);
          log.gcalEventId = null;
          dataChanged = true;
          deleted++;
        }
        continue;
      }
      const body = gcalBuildEventBody(client, log);
      try{
        if(log.gcalEventId){
          const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${log.gcalEventId}`, {
            method: 'PATCH',
            headers: { 'Authorization': 'Bearer ' + gcalAccessToken, 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          if(res.ok) updated++; else failed++;
        }else{
          const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + gcalAccessToken, 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          if(res.ok){
            const data = await res.json();
            log.gcalEventId = data.id;
            dataChanged = true;
            created++;
          }else failed++;
        }
      }catch(e){
        console.error(e);
        failed++;
      }
    }
  }

  if(dataChanged) await saveType('clients');

  document.getElementById('gcalSyncBtn').disabled = false;
  document.getElementById('gcalStatus').textContent = `上次同步：新增 ${created} 筆、更新 ${updated} 筆${deleted?`、移除 ${deleted} 筆`:''}${failed?`、失敗 ${failed} 筆`:''}`;
  showToast(`Google 日曆同步完成：新增 ${created} 筆、更新 ${updated} 筆${deleted?`、移除 ${deleted} 筆`:''}${failed?`、失敗 ${failed} 筆`:''}`);
}

function openDayAgenda(dateStr){
  const events = [];
  DATA.clients.forEach(c=>{
    (c.serviceLogs||[]).forEach(l=>{
      if(l.date === dateStr) events.push({clientId:c.id, logId:l.id, clientName:c.name, isDutyRosterClient:!!c.isDutyRosterClient, time:l.time||'', note:l.note||'', type:l.type||'', completed:!!l.completed, addresses:logItemAddresses(l), relatedListingId:l.relatedListingId||''});
    });
  });
  events.sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const incompleteCount = events.filter(e=>!e.completed).length;

  document.getElementById('dayAgendaTitle').textContent = dateStr + ' 的行程';
  document.getElementById('dayAgendaBody').innerHTML = events.length ? `
    ${incompleteCount>0 ? `
    <div class="section-block" style="margin-bottom:10px; padding:10px; background:var(--stone);">
      <div style="font-size:12px; color:var(--ink-soft); margin-bottom:6px;">把這天「尚未完成」的 ${incompleteCount} 筆行程，一次改到別天（已完成的不會被搬動）：</div>
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <input type="date" id="dayAgendaBulkMoveDate" class="filter-select" style="max-width:160px;">
        <button class="btn btn-primary btn-sm" type="button" onclick="dayAgendaBulkMoveIncomplete('${dateStr}')">搬移未完成項目</button>
      </div>
    </div>` : ''}
    <div class="log-list">${events.map(e=>{
    const isImportant = !CALENDAR_ROUTINE_TYPES.includes(e.type);
    const lineStyle = isImportant && !e.completed ? 'color:var(--brick); font-size:15px;' : '';
    const trashMatch = e.note && e.note.match(/垃圾車\s*[\d:：]+/);
    const trashLabel = trashMatch ? ` ${esc(trashMatch[0])}` : '';
    const nameLabel = e.isDutyRosterClient ? '' : esc(e.clientName);
    const doneStyle = e.completed ? 'opacity:0.45;' : '';
    const textDeco = e.completed ? 'text-decoration:line-through;' : '';
    return `
    <div class="log-entry" style="${doneStyle}">
      <input type="checkbox" ${e.completed?'checked':''} style="margin-top:2px;" onclick="event.stopPropagation(); toggleLogCompleted('${e.clientId}','${e.logId}','${dateStr}')">
      <div class="log-entry-note" style="cursor:pointer; ${textDeco}" onclick="closeDayAgenda(); ${e.type==='反開發追蹤' && e.relatedListingId ? `openNewListingModal('${e.relatedListingId}')` : `viewClientModal('${e.clientId}')`}">
        <b style="${lineStyle}">${e.time?esc(e.time)+' ':''}${e.type?`[${esc(e.type)}] `:''}${nameLabel}${trashLabel}</b>
        ${e.addresses.length?`<div style="font-size:12px; color:var(--ink); margin-top:2px;">📍 ${e.addresses.map(a=>esc(a)).join('、')}</div>`:''}
        ${e.note?`<div style="font-size:12px; color:var(--ink-soft); margin-top:2px;">${esc(e.note)}</div>`:''}
      </div>
    </div>
  `;
  }).join('')}</div>` : '<div class="empty-state">這天沒有行程</div>';
  document.getElementById('dayAgendaOverlay').classList.add('open');
}
async function dayAgendaBulkMoveIncomplete(dateStr){
  const input = document.getElementById('dayAgendaBulkMoveDate');
  const newDate = input ? input.value : '';
  if(!newDate){ showToast('請先選擇要搬去的日期'); return; }
  if(newDate === dateStr){ showToast('新日期跟原本日期一樣'); return; }
  const touchedClientIds = new Set();
  let moved = 0;
  DATA.clients.forEach(c=>{
    (c.serviceLogs||[]).forEach(l=>{
      if(l.date === dateStr && !l.completed){
        l.date = newDate;
        touchedClientIds.add(c.id);
        moved++;
      }
    });
  });
  if(moved === 0){ showToast('沒有未完成的行程可以搬移'); return; }
  await saveType('clients');
  touchedClientIds.forEach(id=>gcalAutoSyncClient(id));
  showToast(`已把 ${moved} 筆未完成行程改到 ${newDate}`);
  closeDayAgenda();
  drawCalendar();
}
async function toggleLogCompleted(clientId, logId, dateStr){
  const client = DATA.clients.find(c=>c.id===clientId);
  if(!client) return;
  const log = (client.serviceLogs||[]).find(l=>l.id===logId);
  if(!log) return;
  log.completed = !log.completed;
  await saveType('clients');
  openDayAgenda(dateStr);
  drawCalendar();
}
function closeDayAgenda(){
  document.getElementById('dayAgendaOverlay').classList.remove('open');
}

/* ===================== Modal plumbing ===================== */
function openModal(){
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  editingCtx = null;
}
document.getElementById('modalClose').onclick = closeModal;
document.getElementById('modalCancel').onclick = closeModal;
document.getElementById('modalSave').onclick = async ()=>{
  if(!editingCtx) return;
  const saveBtn = document.getElementById('modalSave');
  const originalLabel = saveBtn.textContent;
  saveBtn.disabled = true;
  saveBtn.textContent = '儲存中…';
  let ok = false;
  try{
    if(editingCtx.type==='clients') ok = await saveClient();
    if(editingCtx.type==='greetingCard') ok = await saveGreetingCard();
    if(editingCtx.type==='listings') ok = await saveListing();
    if(editingCtx.type==='content') ok = await saveContent();
    if(editingCtx.type==='deals') ok = await saveDeal();
    if(editingCtx.type==='communities') ok = await saveCommunity();
    if(editingCtx.type==='adQuotas') ok = await saveAdQuota();
    if(editingCtx.type==='newListings') ok = await saveNewListing();
    if(editingCtx.type==='socialMedia') ok = await saveSocialMedia();
  }catch(e){
    showToast('儲存失敗：' + (e && e.message ? e.message : '未知錯誤'));
  }
  saveBtn.disabled = false;
  saveBtn.textContent = originalLabel;
  if(ok){
    showToast('已儲存');
    closeModal();
    render();
  }
};

async function deleteItem(type, id){
  if(!confirm('確定要刪除這筆資料嗎?相關照片也會一併移除。')) return;
  const item = DATA[type].find(x=>x.id===id);
  if(item){
    if(type==='clients') for(const k of getClientCardPhotoKeys(item)) await deleteStoredFile(k);
    if(type==='clients' && item.attachmentKeys) for(const k of item.attachmentKeys) await deleteStoredFile(k);
    if(type==='clients' && item.propertyRecords) for(const r of item.propertyRecords) for(const k of (r.photoKeys||[])) await deleteStoredFile(k);
    if(type==='listings' && item.photoKeys) for(const k of item.photoKeys) await deleteStoredFile(k);
    if(type==='deals' && item.attachmentKeys) for(const k of item.attachmentKeys) await deleteStoredFile(k);
    if(type==='communities' && item.sendLogs) for(const l of item.sendLogs) for(const k of (l.photoKeys||[])) await deleteStoredFile(k);
    if(type==='newListings' && item.statusLogs) for(const s of item.statusLogs) for(const k of (s.photoKeys||[])) await deleteStoredFile(k);
    if(type==='newListings') await syncNewListingCalendarEntry(item.id, item.address, '');
    if(type==='socialMedia' && item.mediaKeys) for(const k of item.mediaKeys) await deleteStoredFile(k);
  }
  DATA[type] = DATA[type].filter(x=>x.id!==id);
  await saveType(type);
  showToast('已刪除');
  render();
}
