<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>房產好夥伴雅慈 · 內部工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --stone:#EDE7DD;
    --stone-deep:#E1D9C9;
    --ink:#2B2620;
    --ink-soft:#5B5347;
    --jade:#3F5B4F;
    --jade-deep:#2E453B;
    --brass:#B08D57;
    --brass-soft:#D9C5A0;
    --brick:#A8462F;
    --paper:#F7F4EC;
    --line:#D8CFBC;
    --radius:2px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--stone);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    min-height:100vh;
  }
  .app{ display:flex; min-height:100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:220px; flex-shrink:0;
    background:var(--jade-deep);
    color:var(--stone);
    display:flex; flex-direction:column;
    padding:28px 0;
  }
  .brand{
    padding:0 24px 24px;
    border-bottom:1px solid rgba(237,231,221,0.15);
    margin-bottom:12px;
  }
  .brand-mark{
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    font-size:22px;
    letter-spacing:2px;
    color:var(--brass-soft);
  }
  .brand-sub{
    font-size:11px;
    letter-spacing:3px;
    color:rgba(237,231,221,0.55);
    margin-top:4px;
  }
  .nav{ display:flex; flex-direction:column; margin-top:8px; }
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:13px 24px;
    font-size:14px; font-weight:500;
    color:rgba(237,231,221,0.75);
    cursor:pointer;
    border-left:3px solid transparent;
    transition:all .15s ease;
    user-select:none;
  }
  .nav-item:hover{ background:rgba(237,231,221,0.06); color:var(--stone); }
  .nav-item.active{
    background:rgba(237,231,221,0.09);
    border-left:3px solid var(--brass);
    color:var(--stone);
    font-weight:700;
  }
  .nav-icon{ width:16px; text-align:center; font-size:14px; opacity:.9; }

  .sidebar-foot{
    margin-top:auto; padding:16px 24px 0;
    font-size:11px; color:rgba(237,231,221,0.4);
    border-top:1px solid rgba(237,231,221,0.12);
    padding-top:16px;
  }
  .btn-sidebar{
    width:100%;
    background:rgba(237,231,221,0.08);
    color:var(--stone);
    border:1px solid rgba(237,231,221,0.25);
    padding:9px 12px; border-radius:var(--radius);
    font-size:12px; font-weight:700; cursor:pointer;
    font-family:'Noto Sans TC', sans-serif;
  }
  .btn-sidebar:hover{ background:rgba(237,231,221,0.16); }

  /* ---------- Main ---------- */
  .main{ flex:1; padding:36px 44px; max-width:1180px; }
  .page-head{
    display:flex; justify-content:space-between; align-items:flex-end;
    margin-bottom:28px; flex-wrap:wrap; gap:16px;
  }
  .page-title{
    font-family:'Noto Serif TC', serif;
    font-weight:900; font-size:28px; color:var(--ink);
    display:flex; align-items:baseline; gap:10px;
  }
  .page-title .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px; font-weight:600; letter-spacing:2px;
    color:var(--brass); text-transform:uppercase;
    background:var(--brass-soft); padding:3px 8px; border-radius:2px;
  }
  .page-desc{ font-size:13px; color:var(--ink-soft); margin-top:4px; }

  .btn{
    font-family:'Noto Sans TC', sans-serif;
    font-weight:700; font-size:13px;
    padding:10px 18px; border-radius:var(--radius);
    border:none; cursor:pointer;
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .btn:active{ transform:translateY(1px); }
  .btn-primary{ background:var(--jade); color:var(--paper); }
  .btn-primary:hover{ background:var(--jade-deep); }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); }
  .btn-ghost:hover{ border-color:var(--ink-soft); color:var(--ink); }
  .btn-danger{ background:transparent; color:var(--brick); border:1px solid rgba(168,70,47,.3); }
  .btn-danger:hover{ background:rgba(168,70,47,.08); }
  .btn-sm{ padding:6px 12px; font-size:12px; }

  /* ---------- Cards / grid ---------- */
  .stat-row{
    display:grid; grid-template-columns:repeat(5,1fr); gap:14px;
    margin-bottom:32px;
  }
  .stat-card{
    background:var(--paper); border:1px solid var(--line);
    padding:18px 20px; border-radius:var(--radius);
    position:relative; overflow:hidden;
  }
  .stat-card::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:var(--brass);
  }
  .stat-num{
    font-family:'JetBrains Mono', monospace;
    font-weight:600; font-size:26px; color:var(--jade-deep);
  }
  .stat-label{ font-size:12px; color:var(--ink-soft); margin-top:4px; }

  .section-block{
    background:var(--paper); border:1px solid var(--line);
    border-radius:var(--radius); margin-bottom:20px;
  }
  .section-block-head{
    padding:16px 20px; border-bottom:1px solid var(--line);
    font-weight:700; font-size:14px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .section-block-body{ padding:16px 20px; }

  .empty-state{
    text-align:center; padding:40px 20px; color:var(--ink-soft); font-size:13px;
  }

  /* ---------- Table ---------- */
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{
    text-align:left; padding:10px 12px;
    font-size:11px; letter-spacing:1px; text-transform:uppercase;
    color:var(--ink-soft); border-bottom:2px solid var(--line);
    font-weight:600;
  }
  td{ padding:12px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  tr.row-hover:hover{ background:var(--stone); }

  /* ---------- Stamp badges (signature element) ---------- */
  .stamp{
    display:inline-flex; align-items:center; justify-content:center;
    font-family:'Noto Serif TC', serif; font-weight:900;
    font-size:11px; letter-spacing:1px;
    border:1.5px solid currentColor; border-radius:3px;
    padding:3px 9px;
    transform:rotate(-2deg);
    position:relative;
  }
  .stamp::after{
    content:''; position:absolute; inset:2px;
    border:1px solid currentColor; border-radius:1px; opacity:.4;
  }
  .stamp-active{ color:var(--jade); }
  .stamp-done{ color:var(--brick); }
  .stamp-pending{ color:var(--brass); }
  .stamp-lost{ color:var(--ink-soft); }

  .tag{
    display:inline-block; font-size:11px; font-weight:600;
    padding:2px 8px; border-radius:10px;
    background:var(--stone-deep); color:var(--ink-soft);
  }
  .tag-soft{
    display:inline-block; font-size:11px; font-weight:600;
    color:var(--ink-soft);
  }

  .row-actions{ display:flex; gap:6px; }
  .icon-btn{
    background:none; border:none; cursor:pointer;
    color:var(--ink-soft); font-size:14px; padding:4px 6px;
    border-radius:2px;
  }
  .icon-btn:hover{ color:var(--ink); background:var(--stone); }

  .toolbar{ display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
  .search-input, select.filter-select{
    font-family:'Noto Sans TC', sans-serif;
    padding:9px 12px; border:1px solid var(--line); border-radius:var(--radius);
    background:var(--paper); font-size:13px; color:var(--ink);
  }
  .search-input{ flex:1; min-width:180px; }
  .search-input:focus, select.filter-select:focus, input:focus, textarea:focus{
    outline:2px solid var(--brass); outline-offset:1px;
  }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(43,38,32,0.5);
    display:none; align-items:flex-start; justify-content:center;
    padding:40px 20px; overflow-y:auto; z-index:100;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background:var(--paper); width:100%; max-width:560px;
    border-radius:var(--radius); border:1px solid var(--line);
    box-shadow:0 20px 60px rgba(43,38,32,0.25);
  }
  .modal-head{
    padding:20px 24px; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
  }
  .modal-title{ font-family:'Noto Serif TC', serif; font-weight:700; font-size:18px; }
  .modal-close{ background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink-soft); }
  .modal-body{ padding:20px 24px; display:flex; flex-direction:column; gap:16px; max-height:65vh; overflow-y:auto; }
  .modal-foot{ padding:16px 24px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px; }

  .field label{ display:block; font-size:12px; font-weight:700; margin-bottom:6px; color:var(--ink-soft); }
  .field input, .field select, .field textarea{
    width:100%; padding:10px 12px; border:1px solid var(--line);
    border-radius:var(--radius); font-family:'Noto Sans TC', sans-serif; font-size:13px;
    background:#fff; color:var(--ink);
  }
  .field textarea{ resize:vertical; min-height:60px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .field-divider{ border-top:1px dashed var(--line); padding-top:14px; margin-top:2px; }
  .field-sub-title{ font-size:16px; font-weight:700; color:var(--jade-deep); margin-bottom:8px; letter-spacing:.5px; }

  /* ---------- Photo upload ---------- */
  .photo-chip{
    position:relative; width:72px; height:72px; border-radius:2px; overflow:hidden;
    border:1px solid var(--line); flex-shrink:0;
  }
  .photo-chip img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-chip .rm{
    position:absolute; top:2px; right:2px; background:rgba(43,38,32,0.75); color:#fff;
    border:none; width:18px; height:18px; border-radius:50%; font-size:11px; cursor:pointer;
    display:flex;align-items:center;justify-content:center; line-height:1;
  }
  .photo-grid{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .upload-btn{
    display:inline-flex; align-items:center; gap:6px;
    border:1px dashed var(--line); border-radius:2px; padding:0 14px;
    width:72px; height:72px; justify-content:center; text-align:center;
    font-size:11px; color:var(--ink-soft); cursor:pointer; background:var(--stone);
    flex-shrink:0; line-height:1.3;
  }
  .upload-btn:hover{ border-color:var(--jade); color:var(--jade); }
  .card-photo-row{ display:flex; align-items:center; gap:12px; }
  .card-photo-preview{
    width:130px; height:82px; border:1px solid var(--line); border-radius:2px;
    overflow:hidden; display:flex; align-items:center; justify-content:center;
    background:var(--stone); color:var(--ink-soft); font-size:11px; flex-shrink:0; position:relative;
  }
  .card-photo-preview img{ width:100%; height:100%; object-fit:cover; }
  .card-photo-preview .rm{
    position:absolute; top:2px; right:2px; background:rgba(43,38,32,0.75); color:#fff;
    border:none; width:18px; height:18px; border-radius:50%; font-size:11px; cursor:pointer;
  }

  /* ---------- Service log ---------- */
  .log-list{ display:flex; flex-direction:column; gap:8px; border:1px solid var(--line); border-radius:2px; padding:10px; background:var(--stone); }
  .log-entry{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; font-size:12px; background:var(--paper); padding:8px 10px; border-radius:2px; border:1px solid var(--line); }
  .log-entry-date{ font-family:'JetBrains Mono',monospace; color:var(--brass); font-weight:700; white-space:nowrap; }
  .log-entry-note{ flex:1; color:var(--ink); line-height:1.5; }
  .log-entry .rm{ background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:13px; flex-shrink:0; }
  .log-entry .rm:hover{ color:var(--brick); }
  .log-add-row{ display:flex; gap:6px; margin-top:10px; }
  .log-add-row input[type=date]{ width:132px; flex-shrink:0; }
  .log-add-row input[type=text]{ flex:1; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--jade-deep); color:var(--stone); padding:12px 22px;
    border-radius:var(--radius); font-size:13px; font-weight:600;
    opacity:0; transition:all .25s ease; z-index:200; pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .loading-note{ font-size:12px; color:var(--ink-soft); padding:20px; }

  /* ---------- Post tool page (scoped under .pt-page) ---------- */
  .pt-page{ background:var(--stone); border-radius:var(--radius); overflow:hidden; border:1px solid var(--line); }
  .pt-header{ background:var(--jade-deep); color:var(--paper); padding:28px 20px 24px; text-align:center; }
  .pt-header h1{ font-family:'Noto Serif TC',serif; font-weight:700; font-size:22px; margin:0 0 4px; letter-spacing:.04em; }
  .pt-header p{ margin:0; font-size:13px; color:var(--brass-soft); }
  .pt-main{ max-width:560px; margin:0 auto; padding:20px 16px 40px; }
  .pt-step{ background:#fff; border:1px solid var(--line); border-radius:6px; padding:18px 16px; margin-bottom:16px; }
  .pt-step-label{ display:flex; align-items:center; gap:8px; font-family:'Noto Serif TC',serif; font-weight:700; font-size:15px; color:var(--jade-deep); margin-bottom:10px; }
  .pt-step-num{ width:22px;height:22px; border-radius:50%; background:var(--brass); color:#fff; font-size:12px; display:flex;align-items:center;justify-content:center; flex-shrink:0; }
  .pt-page input[type=text], .pt-page input[type=url], .pt-page textarea{
    width:100%; border:1px solid var(--line); border-radius:6px; padding:10px 12px;
    font-family:'Noto Sans TC',sans-serif; font-size:14px; color:var(--ink); background:var(--paper);
  }
  .pt-page input:focus, .pt-page textarea:focus{ outline:2px solid var(--brass); outline-offset:1px; background:#fff; }
  .pt-page textarea{ min-height:180px; resize:vertical; line-height:1.7; }
  .pt-hint{ font-size:12px; color:var(--ink-soft); margin-top:6px; }
  .pt-page button{ font-family:'Noto Sans TC',sans-serif; font-weight:700; font-size:14px; border:none; border-radius:6px; padding:11px 18px; cursor:pointer; transition:opacity .15s; }
  .pt-page button:disabled{ opacity:.5; cursor:not-allowed; }
  .pt-page button:hover:not(:disabled){ opacity:.88; }
  .pt-btn-primary{ background:var(--jade); color:#fff; width:100%; }
  .pt-btn-brass{ background:var(--brass); color:#fff; }
  .pt-btn-outline{ background:transparent; color:var(--jade); border:1px solid var(--jade); }
  .pt-row-buttons{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .pt-row-buttons button{ flex:1; min-width:120px; }
  .pt-notice{ background:var(--brass-soft); border:1px solid var(--brass); border-radius:8px; padding:12px 14px; font-size:12.5px; color:var(--ink); margin-bottom:16px; }
  .pt-notice b{ color:var(--brick); }
  .pt-spinner{ display:inline-block; width:14px;height:14px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:pt-spin .7s linear infinite; vertical-align:-2px; margin-right:6px; }
  @keyframes pt-spin{ to{ transform:rotate(360deg); } }
  .pt-fb-card{ border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff; }
  .pt-fb-card-head{ display:flex; align-items:center; gap:10px; padding:12px 14px 8px; }
  .pt-fb-avatar{ width:38px;height:38px; border-radius:50%; background:var(--jade-deep); color:#fff; font-family:'Noto Serif TC',serif; font-weight:700; display:flex;align-items:center;justify-content:center; font-size:15px; flex-shrink:0; }
  .pt-fb-name{ font-weight:700; font-size:14px; color:var(--ink); }
  .pt-fb-meta{ font-size:11.5px; color:var(--ink-soft); }
  .pt-fb-body{ padding:4px 14px 16px; white-space:pre-wrap; font-size:14px; color:var(--ink); }
  .pt-status{ font-size:12.5px; margin-top:8px; color:var(--ink-soft); }
  .pt-status.ok{ color:var(--jade); }
  .pt-status.err{ color:var(--brick); }
  .pt-photo-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(84px, 1fr)); gap:8px; margin-bottom:4px; }
  .pt-photo-thumb{ position:relative; aspect-ratio:1; border:1px solid var(--line); overflow:hidden; background:var(--stone-deep); }
  .pt-photo-thumb img{ width:100%; height:100%; object-fit:cover; display:block; cursor:pointer; }
  .pt-photo-thumb .pt-remove-btn{ position:absolute; top:2px;right:2px; width:20px;height:20px; border-radius:50%; background:rgba(43,38,32,.7); color:#fff; border:none; font-size:12px; line-height:1; cursor:pointer; padding:0; }

  /* ---------- Calendar page ---------- */
  .cal-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:11px; font-weight:700; color:var(--ink-soft); padding:8px 0; border-bottom:1px solid var(--line); }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); }
  .cal-cell{ border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:6px; min-height:92px; overflow:hidden; }
  .cal-grid .cal-cell:nth-child(7n){ border-right:none; }
  .cal-empty{ background:var(--stone); }
  .cal-today{ background:var(--brass-soft); }
  .cal-daynum{ font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:4px; }
  .cal-events{ display:flex; flex-direction:column; gap:2px; }
  .cal-event{ font-size:11px; background:var(--jade); color:#fff; padding:2px 5px; border-radius:2px; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:flex; align-items:center; gap:3px; }
  .cal-event:hover{ background:var(--jade-deep); }
  .cal-event input[type=checkbox]{ width:11px; height:11px; flex-shrink:0; cursor:pointer; margin:0; }
  .cal-event span{ overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
  .cal-event-count{ font-size:11px; background:var(--jade); color:#fff; padding:3px 6px; border-radius:2px; text-align:center; }
  .cal-cell:hover .cal-event-count{ background:var(--jade-deep); }
  .cal-event-count-important{ background:var(--brick); font-weight:700; }
  .cal-cell:hover .cal-event-count-important{ background:var(--brick); opacity:.88; }

  @media (max-width:820px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; flex-direction:row; overflow-x:auto; padding:14px 0; align-items:center; }
    .brand{ display:none; }
    .nav{ flex-direction:row; }
    .nav-item{ padding:10px 16px; border-left:none; border-bottom:3px solid transparent; white-space:nowrap; }
    .nav-item.active{ border-left:none; border-bottom:3px solid var(--brass); }
    .sidebar-foot{ display:none; }
    .main{ padding:20px; }
    .stat-row{ grid-template-columns:1fr 1fr; }
    .field-row{ grid-template-columns:1fr; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

<div id="loginScreen" style="display:flex; min-height:100vh; align-items:center; justify-content:center; background:var(--stone);">
  <div style="background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:36px 32px; width:100%; max-width:340px;">
    <div style="font-family:'Noto Serif TC',serif; font-weight:900; font-size:22px; color:var(--jade-deep); text-align:center; margin-bottom:4px;">雅慈工作台</div>
    <div style="font-size:12px; color:var(--ink-soft); text-align:center; margin-bottom:24px;">登入後才能查看資料</div>
    <div class="field"><label>Email</label><input type="email" id="loginEmail" autocomplete="username"></div>
    <div class="field" style="margin-top:12px;"><label>密碼</label><input type="password" id="loginPassword" autocomplete="current-password"></div>
    <button class="btn btn-primary" id="loginBtn" style="width:100%; margin-top:18px;">登入</button>
    <div id="loginError" style="color:var(--brick); font-size:12px; margin-top:10px; min-height:16px;"></div>
  </div>
</div>

<div class="app" style="display:none;">
  <div class="sidebar">
    <div class="brand">
      <div class="brand-mark">雅慈工作台</div>
      <div class="brand-sub">房產好夥伴</div>
    </div>
    <div class="nav" id="nav">
      <div class="nav-item active" data-page="dashboard"><span class="nav-icon">◆</span>總覽</div>
      <div class="nav-item" data-page="clients"><span class="nav-icon">☰</span>客戶名單</div>
      <div class="nav-item" data-page="soldclients"><span class="nav-icon">✓</span>已成交客戶</div>
      <div class="nav-item" data-page="entrusted"><span class="nav-icon">⌂</span>物件委託</div>

<script>
/* ===================== State ===================== */
let DATA = { clients: [], listings: [], content: [], deals: [], communities: [], adQuotas: [], newListings: [], socialMedia: [] };
let currentPage = 'dashboard';
let clientListPage = 1;
let clientSearchQuery = '';
let clientStatusFilterValue = '';
const CLIENT_PAGE_SIZE = 10;
let editingCtx = null; // {type, id, ...extra}
let calendarMonth = new Date();
let loaded = false;

const KEYS = { clients:'clients', listings:'listings', content:'content', deals:'deals', communities:'communities', adQuotas:'adQuotas', newListings:'newListings', socialMedia:'socialMedia' };

/* ===================== Storage: records (chunked to stay under Firestore's ~1MB per-document limit) ===================== */
function utf8ByteLength(str){
  return new TextEncoder().encode(str).length;
}
function chunkArrayBySize(arr, maxBytes){
  const chunks = [];
  let current = [];
  let currentSize = 2;
  for(const item of arr){
    const itemStr = JSON.stringify(item);
    const itemSize = utf8ByteLength(itemStr) + 1;
    if(currentSize + itemSize > maxBytes && current.length > 0){
      chunks.push(current);
      current = [];
      currentSize = 2;
    }
    current.push(item);
    currentSize += itemSize;
  }
  if(current.length || chunks.length === 0) chunks.push(current);
  return chunks;
}

async function loadAll(){
  for(const type of Object.keys(KEYS)){
    const key = KEYS[type];
    try{
      const countRes = await window.storage.get(key + '-shard-count', false);
      const count = countRes && countRes.value ? Number(countRes.value) || 0 : 0;
      if(count > 0){
        let combined = [];
        for(let i=0;i<count;i++){
          const res = await window.storage.get(`${key}-shard-${i}`, false);
          if(res && res.value) combined = combined.concat(JSON.parse(res.value));
        }
        DATA[type] = combined;
      }else{
        const res = await window.storage.get(key, false);
        DATA[type] = res && res.value ? JSON.parse(res.value) : [];
      }
    }catch(e){
      DATA[type] = [];
    }
  }
  loaded = true;
}

async function saveType(type){
  try{
    const key = KEYS[type];
    const chunks = chunkArrayBySize(DATA[type], 700000);

    let oldCount = 0;
    try{
      const meta = await window.storage.get(key + '-shard-count', false);
      oldCount = meta && meta.value ? Number(meta.value) || 0 : 0;
    }catch(e){}

    for(let i=0;i<chunks.length;i++){
      await window.storage.set(`${key}-shard-${i}`, JSON.stringify(chunks[i]), false);
    }
    for(let i=chunks.length;i<oldCount;i++){
      await window.storage.delete(`${key}-shard-${i}`, false);
    }
    await window.storage.set(key + '-shard-count', String(chunks.length), false);
  }catch(e){
    console.error(e);
    showToast('儲存失敗,請稍後再試');
  }
}

/* ===================== Storage: photos (separate keys) ===================== */
async function savePhoto(key, dataUrl){
  try{ await window.storage.set(key, dataUrl, false); }catch(e){ showToast('照片儲存失敗'); }
}
async function loadPhoto(key){
  if(!key) return null;
  try{ const r = await window.storage.get(key, false); return r ? r.value : null; }catch(e){ return null; }
}
async function deletePhoto(key){
  if(!key) return;
  try{ await window.storage.delete(key, false); }catch(e){ /* ignore */ }
}

/* Chunked storage for larger files (PDFs, docs) that would exceed a single Firestore document's size limit */
const FILE_CHUNK_SIZE = 700000;
function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_, reject)=>setTimeout(()=>reject(new Error(`${label||'操作'}逾時(超過${Math.round(ms/1000)}秒無回應)`)), ms)),
  ]);
}

async function saveOneChunkWithRetry(baseKey, i, chunkData, totalChunks){
  let lastErr = null;
  for(let attempt=1; attempt<=5; attempt++){
    try{
      await withTimeout(window.storage.set(`${baseKey}-chunk-${i}`, chunkData, false), 45000, `第${i+1}份儲存`);
      return;
    }catch(e){
      lastErr = e;
      if(attempt<5) await new Promise(r=>setTimeout(r, 1500*attempt));
    }
  }
  throw new Error(`檔案第 ${i+1}/${totalChunks} 份儲存失敗(已重試5次)：${lastErr && lastErr.message ? lastErr.message : '未知錯誤'}`);
}

async function saveFileChunked(baseKey, dataUrl, onProgress){
  const chunks = [];
  for(let i=0; i<dataUrl.length; i+=FILE_CHUNK_SIZE){
    chunks.push(dataUrl.slice(i, i+FILE_CHUNK_SIZE));
  }
  const BATCH_SIZE = 3;
  let done = 0;
  for(let start=0; start<chunks.length; start+=BATCH_SIZE){
    const batchIndices = [];
    for(let i=start; i<Math.min(start+BATCH_SIZE, chunks.length); i++) batchIndices.push(i);
    await Promise.all(batchIndices.map(i=>saveOneChunkWithRetry(baseKey, i, chunks[i], chunks.length)));
    done += batchIndices.length;
    if(onProgress && chunks.length>3) onProgress(done, chunks.length);
  }
  await withTimeout(window.storage.set(`${baseKey}-chunk-count`, String(chunks.length), false), 45000, '完成儲存');
}
async function loadFileChunked(baseKey){
  if(!baseKey) return null;
  try{
    const countRes = await withTimeout(window.storage.get(`${baseKey}-chunk-count`, false), 20000, '讀取檔案');
    const count = countRes && countRes.value ? Number(countRes.value) || 0 : 0;
    if(count === 0) return null;
    const indices = Array.from({length:count}, (_,i)=>i);
    const results = await Promise.all(indices.map(i=>withTimeout(window.storage.get(`${baseKey}-chunk-${i}`, false), 20000, '讀取檔案').catch(()=>null)));
    return results.map(res=>(res && res.value) ? res.value : '').join('');
  }catch(e){ return null; }
}
async function deleteFileChunked(baseKey){
  if(!baseKey) return;
  try{
    const countRes = await window.storage.get(`${baseKey}-chunk-count`, false);
    const count = countRes && countRes.value ? Number(countRes.value) || 0 : 0;
    for(let i=0;i<count;i++){
      await window.storage.delete(`${baseKey}-chunk-${i}`, false);
    }
    await window.storage.delete(`${baseKey}-chunk-count`, false);
  }catch(e){ /* ignore */ }
}
async function loadStoredFile(key){
  const chunked = await loadFileChunked(key);
  if(chunked) return chunked;
  return await loadPhoto(key);
}
async function loadDealFile(key){
  return await loadStoredFile(key);
}
async function deleteStoredFile(key){
  await deleteFileChunked(key);
  await deletePhoto(key);
}
function openDataUrlInNewTab(dataUrl){
  try{
    const commaIdx = dataUrl.indexOf(',');
    const header = dataUrl.slice(0, commaIdx);
    const base64 = dataUrl.slice(commaIdx+1);
    const mimeMatch = header.match(/data:(.*?);base64/);
    const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
    const byteString = atob(base64);
    const bytes = new Uint8Array(byteString.length);
    for(let i=0;i<byteString.length;i++){ bytes[i] = byteString.charCodeAt(i); }
    const blob = new Blob([bytes], {type: mime});
    const blobUrl = URL.createObjectURL(blob);
    const win = window.open(blobUrl, '_blank');
    if(!win) showToast('瀏覽器擋掉了彈出視窗,請允許彈出視窗後再試一次');
    setTimeout(()=>URL.revokeObjectURL(blobUrl), 60000);
  }catch(e){
    window.open(dataUrl, '_blank');
  }
}

async function saveStoredFile(key, dataUrl, fileLabel){
  const saveBtn = document.getElementById('modalSave');
  try{
    await saveFileChunked(key, dataUrl, (done, total)=>{
      if(saveBtn) saveBtn.textContent = `儲存中…(${fileLabel||'檔案'} ${done}/${total})`;
    });
    if(saveBtn) saveBtn.textContent = '儲存中…';
    return true;
  }catch(e){
    showToast((fileLabel||'檔案') + ' 儲存失敗：' + (e && e.message ? e.message : '未知錯誤') + '，請稍後再試一次');
    return false;
  }
}

function resizeImage(file, maxDim=900, quality=0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else{ if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function readFileAsDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function isImageDataUrl(url){
  return /^data:image\//.test(url||'');
}
function isVideoDataUrl(url){
  return /^data:video\//.test(url||'');
}
function mimeExtFromDataUrl(url){
  const m = /^data:([^;]+);/.exec(url||'');
  const mime = m ? m[1] : '';
  const map = {
    'application/pdf':'.pdf',
    'application/msword':'.doc',
    'application/vnd.openxmlformats-officedocument.wordprocessingml.document':'.docx',
    'application/vnd.ms-excel':'.xls',
    'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'.xlsx',
    'image/jpeg':'.jpg', 'image/png':'.png', 'image/webp':'.webp', 'image/gif':'.gif',
    'text/plain':'.txt',
    'video/mp4':'.mp4', 'video/quicktime':'.mov', 'video/webm':'.webm',
    'video/x-msvideo':'.avi', 'video/3gpp':'.3gp', 'video/x-matroska':'.mkv'
  };
  return map[mime] || '';
}

      'FB': c.fb || '',
      '公司名稱': c.company || '',
      '身份證字號': c.idNumber || '',
      '居住地址': c.homeAddress || '',

  ['售','租','解約'].forEach(t=>{
    const ascByDate = DATA.deals.filter(d=>(d.dealType||'售')===t).sort(dealDateAscComparator);
    ascByDate.forEach((d,i)=>{ d._orderLabel = `${t}${i+1}件`; });
  });
  const dealRows = DATA.deals.map(d=>{
    const collected = (d.collections||[]).reduce((s,c)=>s+(Number(c.personalAmount)||0),0);
    const actualPerformance = dealActualPerformance(d);
    return {
      '序號': d._orderLabel || '',
      '租售': d.dealType || '售',
      '客戶姓名': d.clientName || '',
      '案件名稱': d.caseName || '',
      '物件地址': d.propertyAddress || '',
      '成交日期': d.closedDate || '',
      '成交金額(萬)': d.amount || '',
      '買方服務費': d.buyerFee || '',
      '賣方服務費': d.sellerFee || '',
      '介紹費': d.referralFee || '',
      '總佣金': (Number(d.buyerFee||0) + Number(d.sellerFee||0) - Number(d.referralFee||0)) || '',
      '開發-店名': d.devStore || '',
      '開發-業務': d.devAgent || '',
      '開發-比例%': d.devPercent || '',
      '開發-金額': d.devAmount || '',
      '銷售-店名': d.saleStore || '',
      '銷售-業務': d.saleAgent || '',
      '銷售-比例%': d.salePercent || '',
      '銷售-金額': d.saleAmount || '',
      '買方姓名': d.buyerName || '',
      '買方電話': d.buyerPhone || '',
      '賣方姓名': d.sellerName || '',
      '賣方電話': d.sellerPhone || '',
      '實際業績': actualPerformance,
      '已領金額': collected,
      '備註': d.notes || '',
    };
  });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(clientRows), '客戶');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(dealRows), '業績成交');
  XLSX.writeFile(wb, `雅慈工作台資料_${new Date().toISOString().slice(0,10)}.xlsx`);
  showToast('已下載 Excel 檔');
}

/* ===================== Import client list from Excel (客戶管理 sheet) ===================== */
function normalizeExcelDate(v){
  if(v instanceof Date && !isNaN(v)){
    const y = v.getFullYear(), m = String(v.getMonth()+1).padStart(2,'0'), d = String(v.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  if(typeof v === 'string'){
    const m = v.trim().match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
    if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  }
  return '';
}

document.getElementById('importExcelBtn').onclick = ()=> document.getElementById('importExcelInput').click();
document.getElementById('importExcelInput').onchange = async (e)=>{
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  if(typeof XLSX === 'undefined'){ showToast('Excel 匯入元件載入失敗,請檢查網路連線'); return; }

  showToast('讀取 Excel 中…');
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:true});
    const sheetName = wb.SheetNames.includes('客戶管理') ? '客戶管理' : wb.SheetNames[0];
    const ws = wb.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
    if(!rows.length){ showToast('找不到資料'); return; }

    const header = rows[0].map(h=>String(h||'').trim());
    const colIndex = name => header.indexOf(name);
    const idx = {
      lineKeyed: colIndex('已KEY到LINE'),
      maintainDate: colIndex('維護日'),
      fileDate: colIndex('建檔日'),
      name: colIndex('客戶姓名'),
      gender: colIndex('性別'),
      buySell: colIndex('買賣'),
      source: colIndex('客戶來源'),
      phone1: colIndex('聯絡電話1'),
      phone2: colIndex('聯絡電話2'),
      phone3: colIndex('聯絡電話3'),
      lineId: colIndex('line ID'),
      company: colIndex('公司名稱'),
      idNumber: colIndex('身分證號'),
      birthday: colIndex('生日'),
      homeAddress: colIndex('居住地址'),
      propertyAddress: colIndex('物件地址'),
      needs: colIndex('需求'),
      background: colIndex('背景'),
      pastEntrusted: colIndex('曾經委託物件'),
      entrusted1: colIndex('委託物件'),
      entrusted2: colIndex('委託物件2'),
      sold1: colIndex('成交物件1'),
      sold2: colIndex('成交物件2'),
      validClient: colIndex('有效客'),
      viewingLog: colIndex('帶看紀錄'),
      matchResponse: colIndex('配對回應'),
      contactLog1: colIndex('聯絡紀錄1'),
      contactLog2: colIndex('聯絡紀錄2'),
      contactLog3: colIndex('聯絡紀錄3'),
    };

    if(idx.name === -1){ showToast('找不到「客戶姓名」欄位,請確認上傳的是客戶管理表'); return; }

    const get = (row, i) => (i>=0 && row[i]!==undefined && row[i]!==null) ? row[i] : '';
    const cellText = v => {
      if(v instanceof Date && !isNaN(v)) return normalizeExcelDate(v);
      return String(v).trim();
    };
    const buySellToTypes = v => {
      const s = String(v||'').trim();
      const types = [];
      if(s.includes('買')) types.push('買方');
      if(s.includes('賣')) types.push('賣方');
      if(s.includes('租')) types.push('租客');
      return types;
    };

    const imported = [];
    for(let r=1; r<rows.length; r++){
      const row = rows[r];
      const name = cellText(get(row, idx.name));
      if(!name) continue;

      const phones = [];
      [idx.phone1, idx.phone2, idx.phone3].forEach(i=>{
        const v = cellText(get(row, i));
        if(v) phones.push({id:uid(), number:v, owner:''});
      });

      const notesParts = [];
      const gender = cellText(get(row, idx.gender));
      if(gender) notesParts.push(`性別:${gender}`);
      const needs = cellText(get(row, idx.needs));
      const background = cellText(get(row, idx.background));
      if(background) notesParts.push(`背景:${background}`);
      const validClient = cellText(get(row, idx.validClient));
      if(validClient) notesParts.push(`有效客:${validClient}`);
      const matchResponse = cellText(get(row, idx.matchResponse));
      if(matchResponse) notesParts.push(`配對回應:${matchResponse}`);
      const maintainDate = cellText(get(row, idx.maintainDate));
      if(maintainDate) notesParts.push(`維護日:${maintainDate}`);
      const lineKeyed = cellText(get(row, idx.lineKeyed));
      if(lineKeyed) notesParts.push(`已KEY到LINE:${lineKeyed}`);

      const birthdayRaw = cellText(get(row, idx.birthday));
      const birthdayNorm = normalizeExcelDate(get(row, idx.birthday));
      if(birthdayRaw && !birthdayNorm) notesParts.push(`生日(原始資料,格式無法辨識):${birthdayRaw}`);
      const fileDateRaw = cellText(get(row, idx.fileDate));
      const fileDateNorm = normalizeExcelDate(get(row, idx.fileDate));
      if(fileDateRaw && !fileDateNorm) notesParts.push(`建檔日(原始資料,格式無法辨識):${fileDateRaw}`);

      const propertyRecords = [];
      const pastEntrusted = cellText(get(row, idx.pastEntrusted));
      if(pastEntrusted) propertyRecords.push({id:uid(), category:'曾經委託', content:pastEntrusted, photoKeys:[]});
      [idx.entrusted1, idx.entrusted2].forEach(i=>{
        const v = cellText(get(row, i));
        if(v) propertyRecords.push({id:uid(), category:'委託中', content:v, photoKeys:[]});
      });
      [idx.sold1, idx.sold2].forEach(i=>{
        const v = cellText(get(row, i));
        if(v) propertyRecords.push({id:uid(), category:'已成交', content:v, photoKeys:[]});
      });

      const serviceLogs = [];
      const viewingLog = cellText(get(row, idx.viewingLog));
      if(viewingLog) serviceLogs.push({id:uid(), date:'', time:'', type:'帶看', note:viewingLog});
      const buySellRaw = String(get(row, idx.buySell)||'');
      const contactType = (buySellRaw.includes('賣') && !buySellRaw.includes('買')) ? '賣方聯絡' : '買方聯絡';
      [idx.contactLog1, idx.contactLog2, idx.contactLog3].forEach(i=>{
        const v = cellText(get(row, i));
        if(v) serviceLogs.push({id:uid(), date:'', time:'', type:contactType, note:v});
      });

      imported.push({
        id: uid(),
        name,
        phones,
        types: buySellToTypes(get(row, idx.buySell)),
        statuses: [],
        birthday: normalizeExcelDate(get(row, idx.birthday)) || '',
        fileDate: normalizeExcelDate(get(row, idx.fileDate)) || '',
        source: cellText(get(row, idx.source)),
        propertyAddress: cellText(get(row, idx.propertyAddress)),
        lineNames: [],
        lineId: cellText(get(row, idx.lineId)),
        fb: '',
        company: cellText(get(row, idx.company)),
        idNumber: cellText(get(row, idx.idNumber)),
        homeAddress: cellText(get(row, idx.homeAddress)),
        clientNeeds: needs,
        propertyRecords,
        notes: notesParts.join('\n'),
        serviceLogs,
        cardPhotoKeys: [],
        attachmentKeys: [],
      });
    }

    if(imported.length===0){ showToast('沒有找到可匯入的客戶資料'); return; }

    const isDuplicate = (newClient, againstList) => {
      const newPhones = new Set(newClient.phones.map(p=>p.number).filter(Boolean));
      return againstList.some(c=>{
        if(c.name !== newClient.name) return false;
        const existingPhones = getClientPhones(c).map(p=>p.number).filter(Boolean);
        if(newPhones.size === 0 && existingPhones.length === 0) return true;
        return existingPhones.some(p=>newPhones.has(p));
      });
    };
    const toAdd = [];
    let skippedCount = 0;
    for(const c of imported){
      if(isDuplicate(c, DATA.clients) || isDuplicate(c, toAdd)){ skippedCount++; } else { toAdd.push(c); }
    }

    if(toAdd.length===0){ showToast(`Excel 裡的 ${imported.length} 筆都跟現有客戶重複(姓名+電話相同),沒有新資料可匯入`); return; }

    const confirmMsg = skippedCount > 0
      ? `找到 ${imported.length} 筆,其中 ${skippedCount} 筆姓名+電話跟現有客戶重複會自動略過,實際會新增 ${toAdd.length} 筆。確定要匯入嗎?`
      : `找到 ${toAdd.length} 筆客戶資料,會新增加到目前的客戶名單裡(不會刪除既有資料)。確定要匯入嗎?`;
    if(!confirm(confirmMsg)) return;

    showToast('匯入中,請稍候(資料量較大,可能需要一點時間)…');
    DATA.clients = DATA.clients.concat(toAdd);
    await saveType('clients');
    render();
    showToast(`已匯入 ${toAdd.length} 筆客戶${skippedCount>0?`(略過 ${skippedCount} 筆重複)`:''}`);
  }catch(err){
    console.error(err);
    showToast('匯入失敗,請確認上傳的是正確的客戶管理 Excel 檔');
  }
};

const AD_PLATFORMS = ['591','樂屋','5168'];
function getAdQuota(platform){
  return DATA.adQuotas.find(q=>q.platform===platform);
}
function adQuotaStatus(q){
  if(!q || !q.expireDate) return {daysLeft:null, remaining:null, urgent:false};
  const todayStr = new Date().toISOString().slice(0,10);
  const daysLeft = Math.round((new Date(q.expireDate+'T00:00:00') - new Date(todayStr+'T00:00:00')) / 86400000);
  const remaining = Math.max(0, Number(q.totalQuota||0) - Number(q.usedQuota||0));
  const urgent = daysLeft<=7 && daysLeft>=0 && remaining>0;
  return {daysLeft, remaining, urgent};
}

const AD_PLATFORM_URLS = { '591':'https://www.591.com.tw/', '樂屋':'https://www.rakuya.com.tw/', '5168':'https://www.houseprice.tw/' };

function renderAdQuotaCard(){
  const rows = AD_PLATFORMS.map(p=>{
    const q = getAdQuota(p);
    const st = adQuotaStatus(q);
    let detail;
    if(!q || !q.expireDate){
      detail = '<span style="color:var(--ink-soft);">尚未設定</span>';
    }else{
      const dayLabel = st.daysLeft<0 ? '已過期' : `剩${st.daysLeft}天`;
      detail = `${dayLabel}　剩餘 ${st.remaining}`;
    }
    return `<div style="display:flex; justify-content:space-between; align-items:center; padding:4px 0; ${st.urgent?'color:var(--brick); font-weight:700;':''}">
      <span>${st.urgent?'⚠ ':''}<a href="${AD_PLATFORM_URLS[p]}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:inherit; text-decoration:underline;">${esc(p)}</a></span>
      <span style="font-size:12px; cursor:pointer;" onclick="openAdQuotaModal('${p}')">${detail}</span>

  return `<div class="stat-card" style="text-align:left;">

}

async function syncNewListingCalendarEntry(listingId, address, nextFollowUpDate){
  const client = getOrCreatePersonalScheduleClient();
  const existingIdx = client.serviceLogs.findIndex(l=>l.type==='反開發追蹤' && l.relatedListingId===listingId);
  if(!nextFollowUpDate){
    if(existingIdx !== -1){
      const removed = client.serviceLogs[existingIdx];
      client.serviceLogs.splice(existingIdx,1);
      await saveType('clients');
      if(removed.gcalEventId) await gcalAutoDeleteEvent(removed.gcalEventId);
    }
    return;
  }
  const noteText = `反開發追蹤：${address||'(未填地址)'}`;
  if(existingIdx !== -1){
    client.serviceLogs[existingIdx].date = nextFollowUpDate;
    client.serviceLogs[existingIdx].note = noteText;
  }else{
    client.serviceLogs.push({id: uid(), date: nextFollowUpDate, time:'', type:'反開發追蹤', note: noteText, relatedListingId: listingId});
  }
  await saveType('clients');
  gcalAutoSyncClient(client.id);
}

async function syncAdQuotaCalendarEntry(platform, expireDate){
  const client = getOrCreatePersonalScheduleClient();
  const marker = `${platform} 廣告到期`;
  const existingIdx = client.serviceLogs.findIndex(l=>l.type==='廣告到期' && l.note===marker);
  if(!expireDate){
    if(existingIdx !== -1){
      const removed = client.serviceLogs[existingIdx];
      client.serviceLogs.splice(existingIdx,1);
      await saveType('clients');
      if(removed.gcalEventId) await gcalAutoDeleteEvent(removed.gcalEventId);
    }
    return;
  }
  if(existingIdx !== -1){
    client.serviceLogs[existingIdx].date = expireDate;
  }else{
    client.serviceLogs.push({id: uid(), date: expireDate, time:'', type:'廣告到期', note: marker});
  }
  await saveType('clients');
  gcalAutoSyncClient(client.id);
}

function getClientPhones(c){
  if(c.phones && c.phones.length) return c.phones;
  if(c.phone) return [{id:'legacy', number:c.phone, owner:''}];
  return [];
}
function getClientCardPhotoKeys(c){
  if(c.cardPhotoKeys && c.cardPhotoKeys.length) return c.cardPhotoKeys;
  if(c.cardPhotoKey) return [c.cardPhotoKey];
  return [];
}
function getPropertyRecordOwners(r){
  if(r.owners && r.owners.length) return r.owners;
  if(r.ownerName || r.ownerIdNumber || r.ownerPhone) return [{id:'legacy', name:r.ownerName||'', idNumber:r.ownerIdNumber||'', phone:r.ownerPhone||''}];
  return [];
}
function getClientTypes(c){
  if(c.types && c.types.length) return c.types;
  if(c.type) return [c.type];
  return [];
}
function getClientStatuses(c){
  if(c.statuses && c.statuses.length) return c.statuses;
  if(c.status) return [c.status];
  return [];
}
function getClientLineNames(c){
  if(c.lineNames && c.lineNames.length) return c.lineNames;
  if(c.lineName) return [c.lineName];
  return [];
}
function getClientPropertyRecords(c){
  const recs = c.propertyRecords ? [...c.propertyRecords] : [];
  if(c.propertyRecords === undefined){
    if(c.pendingTrackProperties) recs.push({id:'legacy-pending', category:'待追蹤', content:c.pendingTrackProperties, photoKeys:[]});
    if(c.soldProperties) recs.push({id:'legacy-sold', category:'已成交', content:c.soldProperties, photoKeys:[]});
    if(c.entrustedInfo) recs.push({id:'legacy-entrusted', category:'委託中', content:c.entrustedInfo, photoKeys:[]});
  }
  if(c.pastEntrustedProperties && !recs.some(r=>r.id==='legacy-past')){
    recs.push({id:'legacy-past', category:'曾經委託', content:c.pastEntrustedProperties, photoKeys:[]});
  }
  return recs;
}
function clientTypesTags(c){
  const types = getClientTypes(c);
  return types.length ? types.map(t=>`<span class="tag">${esc(t)}</span>`).join(' ') : '—';
}
function clientStatusStamps(c){
  const statuses = getClientStatuses(c);
  return statuses.length ? statuses.map(s=>statusStamp(s)).join(' ') : '—';
}
function clientPhoneSummary(c){
  const phones = getClientPhones(c);
  if(!phones.length) return '—';
  const first = phones[0];
  const label = first.owner ? `${esc(first.number)}(${esc(first.owner)})` : esc(first.number);
  return phones.length>1 ? `${label} 等${phones.length}支` : label;
}

const CALENDAR_ROUTINE_TYPES = ['買方聯絡','賣方聯絡'];

function renderUpcomingAppointments(){
  const today = new Date();
  const todayStr = today.toISOString().slice(0,10);
  const limitDate = new Date(today);
  limitDate.setDate(limitDate.getDate()+3);
  const limitStr = limitDate.toISOString().slice(0,10);

  const items = [];
  DATA.clients.forEach(c=>{
    (c.serviceLogs||[]).forEach(l=>{
      if(!l.date || CALENDAR_ROUTINE_TYPES.includes(l.type)) return;
      if(l.date < todayStr || l.date > limitStr) return;
      items.push({clientId:c.id, clientName:c.name, date:l.date, time:l.time||'', type:l.type, note:l.note||''});
    });
  });
  items.sort((a,b)=>((a.date||'')+(a.time||'')).localeCompare((b.date||'')+(b.time||'')));

  if(items.length===0) return '<div class="empty-state">未來 3 天內沒有行程</div>';
  return `<table><thead><tr><th>日期</th><th>時間</th><th>類型</th><th>客戶</th><th>備註</th></tr></thead><tbody>
    ${items.map(e=>`<tr class="row-hover" style="cursor:pointer;" onclick="viewClientModal('${e.clientId}')">
      <td>${esc(e.date)}${e.date===todayStr?' <span class="tag-soft">今天</span>':''}</td>
      <td>${esc(e.time||'—')}</td>
      <td>${statusStamp(e.type)}</td>
      <td>${esc(e.clientName)}</td>
      <td>${esc(e.note||'—')}</td>
    </tr>`).join('')}
  </tbody></table>`;
}

/* ===================== Shared helpers ===================== */
function toggleFieldSection(bodyId, headerEl){
  const el = document.getElementById(bodyId);
  if(!el) return;
  const willShow = el.style.display === 'none';
  el.style.display = willShow ? 'block' : 'none';
  if(headerEl){
    const hint = headerEl.querySelector('span:last-child');
    if(hint) hint.textContent = willShow ? '▴ 點一下收合' : '▾ 點一下展開/收合';
  }
}

function logItemAddresses(l){
  if(!l || !l.extra || !l.extra.items || !l.extra.items.length) return [];
  return l.extra.items
    .filter(it=>it.address)
    .map(it=>[it.address, it.viewMethod, it.devAgent].filter(Boolean).join('・'));
}

function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function formatEntrustDateRange(r){
  const start = r.entrustDateStart || r.entrustDate || '';
  const end = r.entrustDateEnd || '';
  if(start && end) return `${start} ~ ${end}`;
  if(start) return start;
  if(end) return `~ ${end}`;
  return '';
}

/* Custom 24-hour time picker — replaces the native <input type="time">, whose 12hr/24hr display depends on OS locale settings we can't control. This version always shows 24-hour format. */
function timePickerHTML(id, value){
  const parts = (value||'').split(':');
  const h = parts[0] || '';
  const m = parts[1] || '';
  let hourOpts = '<option value="">--</option>';
  for(let i=0;i<24;i++){
    const hh = String(i).padStart(2,'0');
    hourOpts += `<option value="${hh}" ${hh===h?'selected':''}>${hh}</option>`;
  }
  let minOpts = '<option value="">--</option>';
  for(let i=0;i<60;i++){
    const mm = String(i).padStart(2,'0');
    minOpts += `<option value="${mm}" ${mm===m?'selected':''}>${mm}</option>`;
  }
  return `<span class="time-picker-wrap" style="display:inline-flex; align-items:center; gap:3px;">
    <select class="tp-hour" onchange="syncTimePicker('${id}')" style="width:62px;">${hourOpts}</select>
    <span>:</span>
    <select class="tp-min" onchange="syncTimePicker('${id}')" style="width:62px;">${minOpts}</select>
    <input type="hidden" id="${id}" value="${esc(value||'')}">
  </span>`;
}
function syncTimePicker(id){
  const hiddenEl = document.getElementById(id);
  if(!hiddenEl) return;
  const wrap = hiddenEl.closest('.time-picker-wrap');
  if(!wrap) return;
  const h = wrap.querySelector('.tp-hour').value;
  const m = wrap.querySelector('.tp-min').value;
  hiddenEl.value = (h && m) ? `${h}:${m}` : '';
}

function statusStamp(status){
  const map = {
    '追蹤中':'stamp-active','在售':'stamp-active','製作中':'stamp-active','草稿':'stamp-pending',
    '已成交':'stamp-done','已簽約':'stamp-done','已發布':'stamp-done','已買到':'stamp-done','已售出':'stamp-done',
    '已流失':'stamp-lost','已下架':'stamp-lost'
  };
  const cls = map[status] || 'stamp-pending';
  return `<span class="stamp ${cls}">${esc(status)}</span>`;
}

function runDuplicateClientCheck(){
  const clients = DATA.clients.filter(c=>!c.isDutyRosterClient);
  const nameGroups = {};
  const phoneGroups = {};
  clients.forEach(c=>{
    const name = (c.name||'').trim();
    if(name){
      if(!nameGroups[name]) nameGroups[name] = [];
      nameGroups[name].push(c);
    }
    getClientPhones(c).forEach(p=>{
      const num = (p.number||'').trim();
      if(!num) return;
      if(!phoneGroups[num]) phoneGroups[num] = [];
      if(!phoneGroups[num].includes(c)) phoneGroups[num].push(c);
    });
  });
  const dupNameGroups = Object.entries(nameGroups).filter(([,list])=>list.length>1);
  const dupPhoneGroups = Object.entries(phoneGroups).filter(([,list])=>list.length>1);

  const block = document.getElementById('duplicateReportBlock');
  const body = document.getElementById('duplicateReportBody');
  block.style.display = 'block';
  if(dupNameGroups.length===0 && dupPhoneGroups.length===0){
    body.innerHTML = `<div class="field-sub-title">檢查結果</div><div class="empty-state" style="padding:12px;">沒有找到姓名或電話重複的客戶。</div>`;
    return;
  }
  const nameHtml = dupNameGroups.map(([name, list])=>`
    <div class="log-entry" style="flex-direction:column; align-items:stretch;">
      <b>姓名「${esc(name)}」重複 ${list.length} 筆</b>
      <div style="margin-top:4px; display:flex; gap:6px; flex-wrap:wrap;">
        ${list.map(c=>`<button class="btn btn-ghost btn-sm" onclick="openClientModal('${c.id}')">${esc(c.name)}(${clientPhoneSummary(c)||'無電話'})</button>`).join('')}
      </div>
    </div>
  `).join('');
  const phoneHtml = dupPhoneGroups.map(([num, list])=>`
    <div class="log-entry" style="flex-direction:column; align-items:stretch;">
      <b>電話「${esc(num)}」重複 ${list.length} 筆</b>
      <div style="margin-top:4px; display:flex; gap:6px; flex-wrap:wrap;">
        ${list.map(c=>`<button class="btn btn-ghost btn-sm" onclick="openClientModal('${c.id}')">${esc(c.name)}</button>`).join('')}
      </div>
    </div>
  `).join('');
  body.innerHTML = `
    <div class="field-sub-title">檢查結果</div>
    <div class="pt-hint" style="margin:4px 0 10px;">姓名重複 ${dupNameGroups.length} 組、電話重複 ${dupPhoneGroups.length} 組,點客戶名字可以直接打開編輯。</div>
    <div class="log-list">${nameHtml}${phoneHtml}</div>
  `;
}

function clearClientNeedsFilter(){
  document.getElementById('clientNeedsFilterRentBuy').value = '';
  document.getElementById('clientNeedsFilterCounty').value = '';

  document.getElementById('clientNeedsFilterRooms').value = '';
  document.getElementById('clientNeedsFilterParking').value = '';
  clientListPage = 1;
  drawClientTable();
}

function clientSearchText(c){
  const parts = [
    c.name,
    getClientPhones(c).map(p=>`${p.number} ${p.owner||''}`).join(' '),
    getClientTypes(c).join(' '),
    getClientStatuses(c).join(' '),
    c.source, c.propertyAddress, getClientNeedsProfiles(c).map(p=>`${p.relation||''} ${p.clientNeeds||''}`).join(' '),
    getClientLineNames(c).join(' '), c.lineId, c.fb, c.company, c.idNumber, c.homeAddress,
    getClientPropertyRecords(c).map(r=>`${r.category} ${r.caseName||''} ${r.address||''} ${r.content||''}`).join(' '),
    (c.serviceLogs||[]).map(l=>`${l.type||''} ${l.note||''}`).join(' '),
    getClientGreetingCards(c).map(g=>g.note||'').join(' '),
    c.notes
  ];
  return parts.filter(Boolean).join(' ').toLowerCase();
}

function getClientLastServiceTime(c){
  const logs = c.serviceLogs || [];
  if(!logs.length) return null;
  const sorted = logs.slice().sort((a,b)=>((b.date||'')+(b.time||'')).localeCompare((a.date||'')+(a.time||'')));
  const latest = sorted[0];
  if(!latest.date) return null;
  return `${latest.date}${latest.time?' '+latest.time:''}`;
}

function drawClientTable(){
  const q = (document.getElementById('clientSearch').value||'').toLowerCase();
  const st = document.getElementById('clientStatusFilter').value;
  const needsRentBuyEl = document.getElementById('clientNeedsFilterRentBuy');
  const needsCountyEl = document.getElementById('clientNeedsFilterCounty');
  const needsTypeEl = document.getElementById('clientNeedsFilterType');
  const needsRoomsEl = document.getElementById('clientNeedsFilterRooms');
  const needsParkingEl = document.getElementById('clientNeedsFilterParking');
  const needsRentBuy = needsRentBuyEl ? needsRentBuyEl.value : '';
  const needsCounty = needsCountyEl ? needsCountyEl.value : '';
  const needsType = needsTypeEl ? needsTypeEl.value : '';
  const needsRooms = needsRoomsEl ? needsRoomsEl.value : '';
  const needsParking = needsParkingEl ? needsParkingEl.value : '';
  const hasNeedsFilter = needsRentBuy || needsCounty || needsType || needsRooms || needsParking;

  let list = DATA.clients.filter(c=>{
    if(c.isDutyRosterClient) return false;
    const matchQ = !q || clientSearchText(c).includes(q);
    const matchSt = !st || (st==='__uncategorized__' ? getClientStatuses(c).length===0 : getClientStatuses(c).includes(st));
    const profiles = getClientNeedsProfiles(c);
    const matchRentBuy = !needsRentBuy || profiles.some(p=>(p.needsRentOrBuy||[]).includes(needsRentBuy));
    const matchCounty = !needsCounty || profiles.some(p=>(p.needsRegions||[]).some(r=>r.startsWith(needsCounty)));
    const matchType = !needsType || profiles.some(p=>(p.needsPropertyTypes||[]).includes(needsType));
    const matchRooms = !needsRooms || profiles.some(p=>p.needsRoomsMin===needsRooms || p.needsRoomsMax===needsRooms);
    const matchParking = !needsParking || profiles.some(p=>p.needsParking===needsParking);
    return matchQ && matchSt && matchRentBuy && matchCounty && matchType && matchRooms && matchParking;
  });
  list.sort((a,b)=>(b.fileDate||'').localeCompare(a.fileDate||''));
  const countLabel = document.getElementById('clientCountLabel');  const realClientCount = DATA.clients.filter(c=>!c.isDutyRosterClient).length;
  if(countLabel){
    countLabel.textContent = (q || st || hasNeedsFilter)
      ? `符合條件 ${list.length} 筆(共 ${realClientCount} 筆)`
      : `共 ${realClientCount} 筆`;
  }
  const wrap = document.getElementById('clientTableWrap');
  if(list.length===0){ wrap.innerHTML = '<div class="empty-state">沒有符合的客戶</div>'; return; }

  const totalPages = Math.max(1, Math.ceil(list.length / CLIENT_PAGE_SIZE));
  if(clientListPage > totalPages) clientListPage = totalPages;
  if(clientListPage < 1) clientListPage = 1;
  const pageList = list.slice((clientListPage-1)*CLIENT_PAGE_SIZE, clientListPage*CLIENT_PAGE_SIZE);

  wrap.innerHTML = `<table><thead><tr>
    <th>姓名</th><th>電話</th><th>類型</th><th>狀態</th><th>最後服務時間</th><th></th>
  </tr></thead><tbody>
    ${pageList.map(c=>`<tr class="row-hover" style="cursor:pointer;" onclick="viewClientModal('${c.id}')">
      <td>${esc(c.name)}</td>
      <td>${clientPhoneSummary(c)}</td>
      <td>${clientTypesTags(c)}</td>
      <td>${clientStatusStamps(c)}</td>
      <td>${esc(getClientLastServiceTime(c) || '—')}</td>
      <td onclick="event.stopPropagation()"><div class="row-actions">
        <button class="icon-btn" onclick="openClientModal('${c.id}')" title="編輯 / 維護">✎</button>
        <button class="icon-btn" onclick="deleteItem('clients','${c.id}')" title="刪除">🗑</button>
      </div></td>
    </tr>`).join('')}
  </tbody></table>
  <div style="display:flex; justify-content:center; align-items:center; gap:14px; padding:16px 0 4px;">
    <button class="btn btn-ghost btn-sm" ${clientListPage<=1?'disabled':''} onclick="goClientPage(${clientListPage-1})">‹ 上一頁</button>
    <span style="font-size:12px; color:var(--ink-soft);">第 ${clientListPage} / ${totalPages} 頁</span>
    <button class="btn btn-ghost btn-sm" ${clientListPage>=totalPages?'disabled':''} onclick="goClientPage(${clientListPage+1})">下一頁 ›</button>
  </div>`;
}
function goClientPage(p){
  clientListPage = p;
  drawClientTable();
}

function openGreetingCardModal(clientId){
  editingCtx = { type:'greetingCard', clientId };
  document.getElementById('modalTitle').textContent = '新增賀卡紀錄';
  document.getElementById('modalBody').innerHTML = `
    <div class="field"><label>寄送日期</label><input type="date" id="f_cardDate" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="field"><label>備註(選填)</label><input id="f_cardNote" placeholder="例如:賀卡+小禮盒"></div>
  `;
  openModal();
}

async function saveGreetingCard(){
  const date = document.getElementById('f_cardDate').value;
  const note = document.getElementById('f_cardNote').value.trim();
  if(!date){ showToast('請選擇日期'); return false; }
  const idx = DATA.clients.findIndex(c=>c.id===editingCtx.clientId);
  if(idx===-1) return false;
  const client = DATA.clients[idx];
  const cards = getClientGreetingCards(client).concat([{id:uid(), date, note}]);
  DATA.clients[idx] = {...client, greetingCards:cards};
  await saveType('clients');
  return true;
}

async function removeGreetingCard(clientId, cardId){
  const idx = DATA.clients.findIndex(c=>c.id===clientId);
  if(idx===-1) return;
  const client = DATA.clients[idx];
  DATA.clients[idx] = {...client, greetingCards: getClientGreetingCards(client).filter(g=>g.id!==cardId)};
  await saveType('clients');
  drawSoldClientTable();
}

function needsProfileFullSummary(p){
  return [
    (p.needsRentOrBuy||[]).join('/'),
    (p.needsRegions||[]).join('、'),
    (p.needsPropertyTypes||[]).join('、'),
    p.needsBudgetMax ? `${p.needsBudgetMax}萬內` : '',
    (p.needsRoomsMin||p.needsRoomsMax) ? `房數${p.needsRoomsMin||'不限'}~${p.needsRoomsMax||'不限'}` : '',
    (p.needsSizeMin||p.needsSizeMax) ? `建物${p.needsSizeMin||'不限'}~${p.needsSizeMax||'不限'}坪` : '',
    (p.needsLandSizeMin||p.needsLandSizeMax) ? `土地${p.needsLandSizeMin||'不限'}~${p.needsLandSizeMax||'不限'}坪` : '',
    (p.needsAgeMin||p.needsAgeMax) ? `屋齡${p.needsAgeMin||'不限'}~${p.needsAgeMax||'不限'}年` : '',
    (p.needsFloorMin||p.needsFloorMax) ? `樓層${p.needsFloorMin||'不限'}~${p.needsFloorMax||'不限'}` : '',
    (p.needsDirections||[]).length ? `朝向:${p.needsDirections.join('、')}` : '',
    p.needsParking ? `車位:${p.needsParking}` : '',
    (p.needsParkingStyles||[]).length ? `停車方式:${p.needsParkingStyles.join('、')}` : '',
    (p.needsSpecial||[]).length ? `特殊需求:${p.needsSpecial.join('、')}` : '',
    p.clientNeeds ? `備註:${p.clientNeeds}` : '',
  ].filter(Boolean).join(' ・ ');
}

function startNeedsProfileEdit(profileId){
  editingCtx.editingNeedsProfileId = profileId;
  const p = editingCtx.tempNeedsProfiles.find(x=>x.id===profileId);
  editingCtx.editingNeedsProfileRegions = [...((p&&p.needsRegions)||[])];
  renderNeedsProfileList();
  renderNeedsRegionChips();
}

function addNeedsProfile(){
  const newProfile = {
    id: uid(), relation:'', needsRentOrBuy:[], needsRegions:[], needsPropertyTypes:[],
    needsBudgetMax:'', needsRoomsMin:'', needsRoomsMax:'', needsSizeMin:'', needsSizeMax:'',
    needsLandSizeMin:'', needsLandSizeMax:'', needsAgeMin:'', needsAgeMax:'', needsFloorMin:'', needsFloorMax:'',
    needsDirections:[], needsParking:'', needsParkingStyles:[], needsSpecial:[], clientNeeds:'', _isNew:true,
  };
  editingCtx.tempNeedsProfiles.push(newProfile);
  startNeedsProfileEdit(newProfile.id);
}

function saveNeedsProfileEdit(){
  const id = editingCtx.editingNeedsProfileId;
  const p = editingCtx.tempNeedsProfiles.find(x=>x.id===id);
  if(!p) return;
  p.relation = document.getElementById('f_needsRelation').value.trim();
  p.needsRentOrBuy = Array.from(document.querySelectorAll('.f_needs_rentbuy_cb:checked')).map(cb=>cb.value);
  p.needsRegions = editingCtx.editingNeedsProfileRegions || [];
  p.needsPropertyTypes = Array.from(document.querySelectorAll('.f_needs_type_cb:checked')).map(cb=>cb.value);
  p.needsBudgetMax = document.getElementById('f_needsBudgetMax').value.trim();
  p.needsRoomsMin = document.getElementById('f_needsRoomsMin').value;
  p.needsRoomsMax = document.getElementById('f_needsRoomsMax').value;
  p.needsSizeMin = document.getElementById('f_needsSizeMin').value.trim();
  p.needsSizeMax = document.getElementById('f_needsSizeMax').value.trim();
  p.needsLandSizeMin = document.getElementById('f_needsLandSizeMin').value.trim();
  p.needsLandSizeMax = document.getElementById('f_needsLandSizeMax').value.trim();
  p.needsAgeMin = document.getElementById('f_needsAgeMin').value.trim();
  p.needsAgeMax = document.getElementById('f_needsAgeMax').value.trim();
  p.needsFloorMin = document.getElementById('f_needsFloorMin').value.trim();
  p.needsFloorMax = document.getElementById('f_needsFloorMax').value.trim();
  p.needsDirections = Array.from(document.querySelectorAll('.f_needs_direction_cb:checked')).map(cb=>cb.value);
  p.needsParking = document.getElementById('f_needsParking').value;
  p.needsParkingStyles = Array.from(document.querySelectorAll('.f_needs_parkingstyle_cb:checked')).map(cb=>cb.value);
  p.needsSpecial = Array.from(document.querySelectorAll('.f_needs_special_cb:checked')).map(cb=>cb.value);
  p.clientNeeds = document.getElementById('f_clientNeeds').value.trim();
  delete p._isNew;
  editingCtx.editingNeedsProfileId = null;
  renderNeedsProfileList();
}
function cancelNeedsProfileEdit(){
  const id = editingCtx.editingNeedsProfileId;
  const p = editingCtx.tempNeedsProfiles.find(x=>x.id===id);
  if(p && p._isNew){
    editingCtx.tempNeedsProfiles = editingCtx.tempNeedsProfiles.filter(x=>x.id!==id);
  }
  editingCtx.editingNeedsProfileId = null;
  renderNeedsProfileList();
}
function removeNeedsProfile(profileId){
  editingCtx.tempNeedsProfiles = editingCtx.tempNeedsProfiles.filter(p=>p.id!==profileId);
  if(editingCtx.editingNeedsProfileId === profileId) editingCtx.editingNeedsProfileId = null;
  renderNeedsProfileList();
}

function getClientNeedsProfiles(item){
  if(item.needsProfiles && item.needsProfiles.length) return item.needsProfiles;
  const hasOldData = (item.needsRentOrBuy||[]).length || (item.needsRegions||[]).length || (item.needsPropertyTypes||[]).length ||
    item.needsBudgetMax || item.needsRoomsMin || item.needsRoomsMax || item.needsSizeMin || item.needsSizeMax ||
    item.needsLandSizeMin || item.needsLandSizeMax || item.needsAgeMin || item.needsAgeMax || item.needsFloorMin || item.needsFloorMax ||
    (item.needsDirections||[]).length || item.needsParking || (item.needsParkingStyles||[]).length || (item.needsSpecial||[]).length || item.clientNeeds;
  if(!hasOldData) return [];
  return [{
    id: uid(), relation: '',
    needsRentOrBuy: item.needsRentOrBuy||[], needsRegions: item.needsRegions||[], needsPropertyTypes: item.needsPropertyTypes||[],
    needsBudgetMax: item.needsBudgetMax||'', needsRoomsMin: item.needsRoomsMin||'', needsRoomsMax: item.needsRoomsMax||'',
    needsSizeMin: item.needsSizeMin||'', needsSizeMax: item.needsSizeMax||'', needsLandSizeMin: item.needsLandSizeMin||'', needsLandSizeMax: item.needsLandSizeMax||'',
    needsAgeMin: item.needsAgeMin||'', needsAgeMax: item.needsAgeMax||'', needsFloorMin: item.needsFloorMin||'', needsFloorMax: item.needsFloorMax||'',
    needsDirections: item.needsDirections||[], needsParking: item.needsParking||'', needsParkingStyles: item.needsParkingStyles||[],
    needsSpecial: item.needsSpecial||[], clientNeeds: item.clientNeeds||'',
  }];
}

function switchClientTab(tab){
  document.querySelectorAll('.client-tab-basic').forEach(el=>{ el.style.display = tab==='basic' ? '' : 'none'; });
  document.querySelectorAll('.client-tab-needs').forEach(el=>{ el.style.display = tab==='needs' ? '' : 'none'; });
  document.querySelectorAll('.client-tab-property').forEach(el=>{ el.style.display = tab==='property' ? '' : 'none'; });
  document.querySelectorAll('.client-tab-btn').forEach(btn=>{
    const isActive = btn.dataset.tab === tab;
    btn.style.borderBottomColor = isActive ? 'var(--brick)' : 'transparent';
    btn.style.color = isActive ? 'var(--ink)' : 'var(--ink-soft)';
  });
  const modalBodyEl = document.getElementById('modalBody');
  if(modalBodyEl) modalBodyEl.scrollTop = 0;
}

      }else{

/* Add-row helpers: each returns true if something was added.
   Used by their own "新增" buttons, and also auto-run right before
   saving the client so a forgotten "新增" click doesn't lose the draft. */
function addPhoneEntry(){
  const numEl = document.getElementById('phoneNumber');
  const ownerEl = document.getElementById('phoneOwner');
  if(!numEl) return false;
  const num = numEl.value.trim();
  const owner = ownerEl.value.trim();
  if(!num) return false;
  editingCtx.tempPhones.push({id:uid(), number:num, owner});
  numEl.value=''; ownerEl.value='';
  renderPhoneList();
  return true;
}

function addLineNameEntry(){
  const el = document.getElementById('lineNameInput');
  if(!el) return false;
  const v = el.value.trim();
  if(!v) return false;
  editingCtx.tempLineNames.push({id:uid(), value:v});
  el.value='';
  renderLineNameList();
  return true;
}

function renderNeedsRegionDistrictCheckboxes(){
  const county = document.getElementById('needsRegionCounty').value;
  const wrap = document.getElementById('needsRegionDistrictCheckboxes');
  if(!wrap) return;
  if(!county){ wrap.innerHTML = ''; return; }

function getClientKnownAddressesAndUrls(){
  const addresses = new Set();
  const urls = new Set();
  (editingCtx.tempPropertyRecords||[]).forEach(r=>{
    if(r.address) addresses.add(r.address.split('\n')[0].trim());
    else if(r.content) addresses.add(r.content.split('\n')[0].trim());
  });
  (editingCtx.tempLogs||[]).forEach(l=>{
    const config = SERVICE_LOG_EXTRA_FIELDS[l.type];
    if(!config || !l.extra) return;
    if(config.repeating && l.extra.items){
      l.extra.items.forEach(it=>{
        if(it.address) addresses.add(it.address);
        if(it.url) urls.add(it.url);
      });
    }else{
      if(l.extra.address) addresses.add(l.extra.address);
      if(l.extra.url) urls.add(l.extra.url);
      if(l.extra.propertyAddress) addresses.add(l.extra.propertyAddress);
    }
  });
  return { addresses: [...addresses].filter(Boolean), urls: [...urls].filter(Boolean) };
}

function extractCarryoverFieldsFromLog(l){
  if(!l.extra) return null;
  const extra = l.extra;
  const source = (extra.items && extra.items.length) ? extra.items.find(x=>x.address || x.url) : extra;
  if(!source) return null;
  const result = {};
  if(source.address) result.address = source.address;
  else if(source.propertyAddress) result.address = source.propertyAddress;
  if(source.url) result.url = source.url;
  if(source.devCompany) result.devCompany = source.devCompany;
  if(source.devAgent) result.devAgent = source.devAgent;
  if(source.devPhone) result.devPhone = source.devPhone;
  if(source.viewMethod) result.viewMethod = source.viewMethod;
  if(source.commissionSplit) result.commissionSplit = source.commissionSplit;
  if(source.other) result.other = source.other;
  if(source.writtenBottomPrice) result.writtenBottomPrice = source.writtenBottomPrice;
  else if(source.bottomPrice) result.writtenBottomPrice = source.bottomPrice;
  return Object.keys(result).length ? result : null;
}

function collectLogExtraFields(type){
  const config = SERVICE_LOG_EXTRA_FIELDS[type];
  if(!config) return {};
  if(config.repeating){
    return (editingCtx.logViewingItems && editingCtx.logViewingItems.length) ? {items: editingCtx.logViewingItems} : {};
  }
  if(config.special === 'meeting'){
    const extra = {};

    const dateEl = document.getElementById('logExtra_meetingDate');
    const timeEl = document.getElementById('logExtra_meetingTime');

    if(addressEl && addressEl.value.trim()) extra.address = addressEl.value.trim();
    if(parkingEl && parkingEl.value.trim()) extra.parking = parkingEl.value.trim();
    if(dateEl && dateEl.value) extra.meetingDate = dateEl.value;
    if(timeEl && timeEl.value) extra.meetingTime = timeEl.value;
    if(partyEl && partyEl.value){
      extra.party = partyEl.value;
      extra.checklist = MEETING_CHECKLISTS[partyEl.value] || [];
    }

  const extra = {};

    const el = document.getElementById('logExtra_'+f.key);

function formatLogExtraPlainText(l){
  if(!l.extra) return '';
  const config = SERVICE_LOG_EXTRA_FIELDS[l.type];
  if(!config) return '';
  const renderField = (f, v) => v ? `${f.label}:${v}` : '';
  if(config.repeating){
    const items = l.extra.items || [];
    if(!items.length) return '';
    return items.map((it,i)=>{
      const parts = config.fields.map(f=>renderField(f, it[f.key])).filter(Boolean).join(' ');
      return `第${i+1}筆 ${parts}`;
    }).join(' ｜ ');
  }
  const base = config.fields.filter(f=>f.key!=='party').map(f=>renderField(f, l.extra[f.key])).filter(Boolean).join(' ・ ');
  if(config.special === 'meeting' && l.extra.checklist && l.extra.checklist.length){
    return [base, `準備:${l.extra.checklist.join('、')}`].filter(Boolean).join(' ・ ');
  }
  return base;
}

function formatDateWithWeekday(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  if(isNaN(d)) return dateStr;
  const weekdays = ['日','一','二','三','四','五','六'];
  return `${d.getMonth()+1}/${d.getDate()}（${weekdays[d.getDay()]}）`;
}
function toFullwidthTime(t){
  return t ? t.replace(':','：') : '';
}

function buildMeetingMessage(l, clientName){
  const extra = l.extra || {};
  const dateLabel = formatDateWithWeekday(extra.meetingDate || l.date);
  const timeLabel = toFullwidthTime(extra.meetingTime || l.time || '');
  const lines = [];
  if(extra.address) lines.push(`🏠地址：${extra.address}`);
  if(extra.parking) lines.push(`🚘停車場：${extra.parking}`);
  if(dateLabel || timeLabel) lines.push(`⏰時間：${dateLabel}${timeLabel}`);
  if(extra.checklist && extra.checklist.length) lines.push(`📝準備資料：${extra.checklist.join('，')}`);
  if(l.note) lines.push(l.note);
  return lines.join('\n');
}

function formatLogExtra(l, multiline){
  if(!l.extra) return '';
  const config = SERVICE_LOG_EXTRA_FIELDS[l.type];
  if(!config) return '';

  const renderField = (f, v) => {
    if(!v) return '';
    if(f.key === 'url'){
      const href = /^https?:\/\//i.test(v) ? v : 'https://' + v;
      return `${esc(f.label)}:<a href="${esc(href)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--jade-deep); text-decoration:underline;">${esc(v)}</a>`;
    }
    return `${esc(f.label)}:${esc(v)}`;
  };

  const fieldSep = multiline ? '<br>' : ' ';
  const itemSep = multiline ? '<br>' : ' ｜ ';
  const flatSep = multiline ? '<br>' : ' ・ ';

  if(config.repeating){
    const items = l.extra.items || [];
    if(!items.length) return '';
    return items.map((it,i)=>{
      const parts = config.fields.map(f=>renderField(f, it[f.key])).filter(Boolean).join(fieldSep);
      return `第${i+1}筆${multiline?'<br>':' '}${parts}`;
    }).join(itemSep);
  }
  const parts = [];
  config.fields.filter(f=>f.key!=='party').forEach(f=>{
    const html = renderField(f, l.extra[f.key]);
    if(html) parts.push(html);
  });
  if(config.special === 'meeting' && l.extra.checklist && l.extra.checklist.length){
    parts.push(`${esc('準備')}:${esc(l.extra.checklist.join('、'))}`);
  }
  return parts.join(flatSep);
}

  if(editingCtx.expandedOwnerRecordId){
    const rid = editingCtx.expandedOwnerRecordId;
    const nameEl = document.getElementById('ownerName-'+rid);
    const idEl = document.getElementById('ownerIdNumber-'+rid);
    const phoneEl = document.getElementById('ownerPhone-'+rid);
    if(nameEl && ((nameEl.value||'').trim() || (idEl.value||'').trim() || (phoneEl.value||'').trim())){
      addRecordOwner(rid);
    }
  }
  if(editingCtx.editingLogId){
    await saveLogEdit(editingCtx.editingLogId);
  }
  flushPendingViewingItem();
  await addServiceLogEntry(false);
}

  if(editingCtx.expandedRecordId){

function addRecordOwner(recordId){
  const rec = (editingCtx.tempPropertyRecords||[]).find(r=>r.id===recordId);
  if(!rec) return;
  const name = document.getElementById('ownerName-'+recordId).value.trim();
  const idNumber = document.getElementById('ownerIdNumber-'+recordId).value.trim();
  const phone = document.getElementById('ownerPhone-'+recordId).value.trim();
  if(!name && !idNumber && !phone){ showToast('請至少填寫一項屋主資料'); return; }
  if(!rec.owners) rec.owners = getPropertyRecordOwners(rec);
  rec.owners.push({id:uid(), name, idNumber, phone});
  delete rec.ownerName; delete rec.ownerIdNumber; delete rec.ownerPhone;
  renderPropertyRecordList();
}
function removeRecordOwner(recordId, idx){
  const rec = (editingCtx.tempPropertyRecords||[]).find(r=>r.id===recordId);
  if(!rec || !rec.owners) return;
  rec.owners.splice(idx,1);
  renderPropertyRecordList();
}

  renderPropertyRecordList();
}
function savePropertyRecordEdit(recordId){
  const category = document.getElementById('editRecordCategory-'+recordId).value;
  const caseName = document.getElementById('editRecordCaseName-'+recordId).value.trim();
  const address = document.getElementById('editRecordAddress-'+recordId).value.trim();
  const content = document.getElementById('editRecordContent-'+recordId).value.trim();
  const entrustDateStart = document.getElementById('editRecordEntrustDateStart-'+recordId).value;
  const entrustDateEnd = document.getElementById('editRecordEntrustDateEnd-'+recordId).value;
  const askingPrice = document.getElementById('editRecordAsking-'+recordId).value.trim();
  const bottomPrice = document.getElementById('editRecordBottom-'+recordId).value.trim();
  if(!caseName && !address && !content){ showToast('請至少輸入案名、地址或內容其中一項'); return; }
  const rec = (editingCtx.tempPropertyRecords||[]).find(r=>r.id===recordId);
  if(!rec) return;
  const wasSold = rec.category === '已成交';
  if(!rec.priceHistory) rec.priceHistory = [];
  if((askingPrice||'') !== (rec.askingPrice||'') || (bottomPrice||'') !== (rec.bottomPrice||'')){
    rec.priceHistory.push({id:uid(), date:new Date().toISOString().slice(0,10), askingPrice, bottomPrice, note:'變更'});
  }
  rec.category = category;
  rec.caseName = caseName;
  rec.address = address;
  rec.content = content;
  rec.entrustDateStart = entrustDateStart;
  rec.entrustDateEnd = entrustDateEnd;
  delete rec.entrustDate;
  rec.askingPrice = askingPrice;
  rec.bottomPrice = bottomPrice;
  editingCtx.editingRecordId = null;
  renderPropertyRecordList();
  if(category === '已成交' && !wasSold){
    const nameEl = document.getElementById('f_name');
    maybeOfferCreateDeal(nameEl ? nameEl.value.trim() : '', caseName, address);
  }
}

async function loadPropertyRecordAlbum(recordId){
  const record = (editingCtx.tempPropertyRecords||[]).find(r=>r.id===recordId);
  if(!record) return;
  if(!editingCtx.recordPhotosCache[recordId]){
    editingCtx.recordPhotosCache[recordId] = { photos: [], removedKeys: [] };
    for(const k of (record.photoKeys||[])){
      const dataUrl = await loadStoredFile(k);
      if(dataUrl) editingCtx.recordPhotosCache[recordId].photos.push({key:k, dataUrl});
    }
  }
  drawPropertyRecordAlbumGrid(recordId);

  const input = document.getElementById('propRecordPhotoInput-' + recordId);
  if(input){
    input.onchange = async (e)=>{
      const files = Array.from(e.target.files||[]);
      for(const file of files){
        const dataUrl = await readFileAsDataUrl(file);
        editingCtx.recordPhotosCache[recordId].photos.push({key:null, dataUrl});
      }
      e.target.value = '';
      renderPropertyRecordList();
    };
  }
}

function drawPropertyRecordAlbumGrid(recordId){
  const grid = document.getElementById('propRecordPhotoGrid-' + recordId);
  if(!grid) return;
  const cache = editingCtx.recordPhotosCache[recordId];
  const addTile = `<div class="upload-btn" onclick="document.getElementById('propRecordPhotoInput-${recordId}').click()">＋<br>照片/檔案</div>`;
  grid.innerHTML = cache.photos.map((p,idx)=>{
    if(isImageDataUrl(p.dataUrl)){
      return `<div class="photo-chip">
        <img src="${p.dataUrl}" style="cursor:pointer;" onclick="openDataUrlInNewTab('${p.dataUrl}')">
        <button class="rm" onclick="removePropertyRecordPhoto('${recordId}',${idx})" title="移除">✕</button>
      </div>`;
    }
    return `<div class="photo-chip" style="display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:22px; background:var(--stone); gap:2px; cursor:pointer;" onclick="openDataUrlInNewTab('${p.dataUrl}')" title="點擊開啟/下載">
      <span>📄</span><span style="font-size:9px; color:var(--ink-soft);">${mimeExtFromDataUrl(p.dataUrl)||'檔案'}</span>
      <button class="rm" onclick="event.stopPropagation(); removePropertyRecordPhoto('${recordId}',${idx})" title="移除">✕</button>
    </div>`;
  }).join('') + addTile;
}

function removePropertyRecordPhoto(recordId, idx){
  const cache = editingCtx.recordPhotosCache[recordId];
  const p = cache.photos[idx];
  if(p.key) cache.removedKeys.push(p.key);
  cache.photos.splice(idx,1);
  renderPropertyRecordList();
}
function removePropertyRecord(recordId){
  const record = (editingCtx.tempPropertyRecords||[]).find(r=>r.id===recordId);
  if(record && record.photoKeys && record.photoKeys.length){
    editingCtx.removedRecordPhotoKeys.push(...record.photoKeys);
  }
  delete editingCtx.recordPhotosCache[recordId];
  if(editingCtx.expandedRecordId === recordId) editingCtx.expandedRecordId = null;
  if(editingCtx.expandedHistoryRecordId === recordId) editingCtx.expandedHistoryRecordId = null;
  if(editingCtx.expandedOwnerRecordId === recordId) editingCtx.expandedOwnerRecordId = null;
  if(editingCtx.editingRecordId === recordId) editingCtx.editingRecordId = null;
  editingCtx.tempPropertyRecords = editingCtx.tempPropertyRecords.filter(r=>r.id!==recordId);
  renderPropertyRecordList();
}

const CARD_PHOTO_MAX = 3;

  const grid = document.getElementById('cardPhotoGrid');

    const item = DATA.clients.find(c=>c.id===editingCtx.id);
    const keys = item ? getClientCardPhotoKeys(item) : [];
    if(keys.length && !editingCtx._cardPhotosLoaded){
      editingCtx.cardPhotos = [];

      <button class="rm" onclick="removeCardPhoto(${idx})" title="移除">✕</button>

function removeCardPhoto(idx){

}

function startLogEdit(logId){

  if(!l) return;
  editingCtx.editingLogId = logId;
  const config = SERVICE_LOG_EXTRA_FIELDS[l.type];
  editingCtx.editingLogViewingItems = (config && config.repeating && l.extra && l.extra.items) ? JSON.parse(JSON.stringify(l.extra.items)) : [];
  editingCtx.editLogViewingItemEditIndex = -1;

function cancelLogEdit(){
  editingCtx.editingLogId = null;

}

function renderEditLogExtraFields(logId){
  const container = document.getElementById('editLogExtraFields-'+logId);
  if(!container) return;
  const l = (editingCtx.tempLogs||[]).find(x=>x.id===logId);
  const type = document.getElementById('editLogType-'+logId).value;
  const config = SERVICE_LOG_EXTRA_FIELDS[type];
  if(!config){ container.innerHTML = ''; return; }

  if(config.repeating){
    container.innerHTML = `
      <div class="pt-hint" style="margin:0 0 4px;">這筆服務的詳細項目(可加入多筆)</div>
      <div class="log-list" id="editViewingItemsList-${logId}"></div>
